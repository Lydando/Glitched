<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914"><title>NEVERSTILL — Vertical Survival</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;outline:0}#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#8294b4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;opacity:.8;white-space:nowrap}#rotate{display:none;position:fixed;inset:0;background:#050914;color:#d8faff;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:10}#rotate strong{display:block;font-size:20px;margin-bottom:8px}@media(orientation:portrait) and (max-width:700px){#rotate{display:flex}canvas,#hint{visibility:hidden}}
</style></head><body><canvas id="game" aria-label="Neverstill game"></canvas><div id="hint">A / D or ← / → · Space jump · Shift dash · W/S on wires · R restart</div><div id="rotate"><div><strong>Rotate your device</strong>Neverstill is designed for landscape play.</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);const logicalHeight=()=>H/Math.min(W/1000,H/562);
const STORE='neverstill-records-v1';let records={bestHeight:0,bestTime:0,runs:0};try{records={...records,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}
let keys={},touch={left:false,right:false,jump:false,dash:false,up:false,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let pointer=null,controls=[];canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};handlePointer(e.clientX,e.clientY,true)});canvas.addEventListener('pointermove',e=>{if(pointer&&pointer.id===e.pointerId){pointer.x=e.clientX;pointer.y=e.clientY;handlePointer(e.clientX,e.clientY,true)}});function endPointer(e){if(pointer&&pointer.id===e.pointerId){pointer=null;touch.left=touch.right=touch.jump=touch.dash=touch.up=touch.down=false}}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
function handlePointer(x,y,down){const c=controls.find(c=>Math.hypot(x-c.x,y-c.y)<c.r*1.35);touch.left=touch.right=touch.jump=touch.dash=touch.up=touch.down=false;if(!down)return;if(c){if(c.id==='left')touch.left=true;if(c.id==='right')touch.right=true;if(c.id==='jump')touch.jump=true;if(c.id==='dash')touch.dash=true;if(c.id==='up')touch.up=true;if(c.id==='down')touch.down=true;}else if(x<W*.35){if(x<pointer.startX-8)touch.left=true;else if(x>pointer.startX+8)touch.right=true;else touch.left=x<W*.18;}}
let platforms=[],wires=[],particles=[],cameraY=0,wallY=0,wallSpeed=18,elapsed=0,runHeight=0,score=0,gameState='ready',last=0,shake=0;
const world={width:1000};let player;
function makePlayer(){return{x:500,y:0,vx:0,vy:0,w:25,h:36,onGround:false,wallSide:0,dashReady:true,dashTime:0,dashDir:1,climbing:false,wire:null,climbCooldown:0,trail:[],jumpBuffer:0,coyote:0,face:1}}
function addPlatform(x,y,w,type='solid'){platforms.push({x,y,w,h:14,type,phase:Math.random()*6.28,crack:0,dead:false})}
function addWire(x,y1,y2){wires.push({x,y1,y2})}
function generateInitial(){platforms=[];wires=[];addPlatform(335,120,330,'solid');let y=40;for(let i=0;i<16;i++){let gap=rand(78,115),py=y-gap;let side=i%2?rand(550,730):rand(190,420);addPlatform(side,py,rand(130,205),i%5===3?'unstable':'solid');if(i%3===1)addWire(rand(390,610),py+5,y-15);y=py;} }
function reset(){player=makePlayer();player.y=60;cameraY=0;wallY=logicalHeight()+150;wallSpeed=18;elapsed=0;runHeight=0;score=0;shake=0;particles=[];generateInitial();gameState='playing';records.runs++;saveRecords()}
function saveRecords(){try{localStorage.setItem(STORE,JSON.stringify(records))}catch{}}
function burst(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-170,170),vy:rand(-180,130),life:rand(.2,.65),max:.65,size:rand(1,3),color})}
function input(){return{left:keys.a||keys.arrowleft||touch.left,right:keys.d||keys.arrowright||touch.right,jump:keys[' ']||keys.w||keys.arrowup||touch.jump,up:keys.w||keys.arrowup||touch.up,down:keys.s||keys.arrowdown||touch.down,dash:keys.shift||keys.x||touch.dash}}
let jumpWas=false,dashWas=false;
function step(dt){if(gameState!=='playing')return;elapsed+=dt;const inp=input();player.jumpBuffer=inp.jump&&!jumpWas?.12:Math.max(0,player.jumpBuffer-dt);jumpWas=inp.jump;
const dir=(inp.right?1:0)-(inp.left?1:0);if(dir)player.face=dir;
// Find wire proximity and allow vertical climbing only.
player.climbCooldown=Math.max(0,player.climbCooldown-dt);if(!player.climbing){let near=null,dist=Infinity;for(const w of wires){const d=Math.abs(player.x+player.w/2-w.x);if(d<18&&player.y+player.h>w.y1&&player.y<w.y2&&d<dist){near=w;dist=d}}if(near&&(inp.up||inp.down)&&player.climbCooldown===0){player.climbing=true;player.wire=near;player.vx=0;player.vy=0;}}
if(player.climbing){if(!player.wire||player.y+player.h<player.wire.y1-2||player.y>player.wire.y2+4){player.climbing=false;player.wire=null;player.climbCooldown=.18}else{player.x+=(player.wire.x-(player.x+player.w/2))*Math.min(1,dt*16);player.vy=0;player.y+=(inp.up?-1:inp.down?1:0)*155*dt;if(player.jumpBuffer>0){player.climbing=false;player.wire=null;player.vy=-410;player.vx=player.face*145;player.dashReady=true;player.jumpBuffer=0;burst(player.x+12,player.y+20,7,'#8afaff')}}}
if(!player.climbing){if(player.dashTime>0){player.dashTime=Math.max(0,player.dashTime-dt);player.vx=player.dashDir*690;player.vy*=.18;player.trail.push({x:player.x,y:player.y,life:.16});if(player.trail.length>12)player.trail.shift()}else{const target=dir*245;player.vx+=(target-player.vx)*Math.min(1,dt*(dir?13:9));player.vy+=1000*dt;player.vy=Math.min(player.vy,760);if(player.jumpBuffer>0&&(player.onGround||player.coyote>0)){player.vy=-430;player.onGround=false;player.coyote=0;player.jumpBuffer=0;burst(player.x+12,player.y+player.h,5,'#5ceeff')}if(inp.jump&&player.vy< -70)player.vy-=280*dt;}
if(inp.dash&&!dashWas&&player.dashReady&&!player.climbing){player.dashReady=false;player.dashTime=.105;player.dashDir=dir||player.face;player.vx=player.dashDir*690;player.vy=0;burst(player.x+12,player.y+18,10,'#73f5ff')}dashWas=inp.dash;
let oldY=player.y;player.x+=player.vx*dt;player.x=clamp(player.x,24,world.width-player.w-24);player.y+=player.vy*dt;player.onGround=false;player.wallSide=0;
// wall contact: strong push-off, height is influenced by whether jump is held.
if(player.x<=24){player.x=24;if(player.vx<0){player.wallSide=-1;if(player.vy>0)player.vy=Math.min(player.vy,160);if(player.jumpBuffer>0){player.vx=255;player.vy=inp.jump?-465:-380;player.dashReady=true;player.jumpBuffer=0;player.wallSide=0;burst(player.x,player.y+18,8,'#83f7ff')}}}else if(player.x+player.w>=world.width-24){player.x=world.width-player.w-24;if(player.vx>0){player.wallSide=1;if(player.vy>0)player.vy=Math.min(player.vy,160);if(player.jumpBuffer>0){player.vx=-255;player.vy=inp.jump?-465:-380;player.dashReady=true;player.jumpBuffer=0;player.wallSide=0;burst(player.x+player.w,player.y+18,8,'#83f7ff')}}}
for(const p of platforms){if(p.dead)continue;if(p.type==='unstable'&&p.crack>0){p.crack-=dt;if(p.crack<=0)p.dead=true}if(player.vy>=0&&oldY+player.h<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.onGround=true;player.dashReady=true;if(p.type==='unstable'&&p.crack===0)p.crack=0.55;}}
if(player.onGround)player.coyote=.1;else player.coyote=Math.max(0,player.coyote-dt);
// recycle geometry above the player, while maintaining several reachable branches.
const topY=player.y-950;let highest=platforms.reduce((m,p)=>p.dead?m:Math.min(m,p.y),Infinity);while(highest>topY){let py=highest-rand(82,120);let difficulty=Math.min(1,runHeight/2200);let pw=rand(118,195)-difficulty*25;let x=rand(60,world.width-pw-60);let type=Math.random()<.17+difficulty*.12?'unstable':'solid';addPlatform(x,py,pw,type);if(Math.random()<.45)addWire(rand(160,840),py+4,py+rand(110,180));highest=py;}
platforms=platforms.filter(p=>p.y<player.y+H+180&&!p.dead);wires=wires.filter(w=>w.y2<player.y+H+200&&w.y1>player.y-1500);
}
runHeight=Math.max(runHeight,Math.max(0,60-player.y));wallSpeed=Math.min(70,18+elapsed*.38+Math.floor(runHeight/500)*2.2);wallY-=wallSpeed*dt;
// wall is a world-space horizontal boundary that rises toward the player.
if(player.y+player.h>wallY- cameraY+H*.82){/* camera-relative catch check below */}
if(player.y+player.h>=wallY){endRun()}
// particles and dash ghosts
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);player.trail=player.trail.filter(t=>(t.life-=dt)>0);
if(shake>0)shake=Math.max(0,shake-dt*18);
// Camera tracks upward; cameraY is world coordinate at top.
const target=player.y-logicalHeight()*.5;cameraY+=(target-cameraY)*Math.min(1,dt*4.5);
// Catch check: wallY is world coordinate; higher is smaller y.
if(wallY<=player.y+player.h+35)endRun();
}
function endRun(){if(gameState!=='playing')return;gameState='over';records.bestHeight=Math.max(records.bestHeight,Math.floor(runHeight));records.bestTime=Math.max(records.bestTime,elapsed);saveRecords();burst(player.x+12,player.y+18,35,'#ff3b78');shake=1}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);let scale=Math.min(W/1000,H/562);let viewW=W/scale,viewH=H/scale;ctx.save();ctx.scale(scale,scale);ctx.translate((viewW-1000)/2,0);const vh=562;const cam=cameraY+(H/scale-vh)/2;
// background gradient
let g=ctx.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#050914');g.addColorStop(.58,'#071425');g.addColorStop(1,'#0b1021');ctx.fillStyle=g;ctx.fillRect(0,0,1000,vh);
// atmospheric grid and parallax server silhouettes
ctx.save();ctx.translate(0,-(cam*.12%180));for(let y=-180;y<vh+180;y+=90){ctx.strokeStyle='rgba(57,133,173,.09)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}for(let i=0;i<10;i++){let x=i*118+((i%2)*28);ctx.fillStyle='rgba(14,35,57,.7)';ctx.fillRect(x,0,18,vh);ctx.strokeStyle='rgba(63,197,219,.12)';ctx.strokeRect(x+4,0,10,vh);for(let y=40;y<vh;y+=85){ctx.fillStyle='rgba(69,224,245,.14)';ctx.fillRect(x+7,y,4,2)}}ctx.restore();
// side rails
for(let x of [24,952]){ctx.fillStyle='#0b1b2b';ctx.fillRect(x,0,24,vh);ctx.fillStyle='rgba(81,231,244,.32)';ctx.fillRect(x,0,2,vh);ctx.fillStyle='rgba(81,231,244,.08)';ctx.fillRect(x+5,0,2,vh)}
// platform / wire world coordinates transformed by camera
ctx.save();ctx.translate(0,-cam);
for(const w of wires){ctx.strokeStyle='rgba(74,222,239,.18)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(w.x,w.y1);ctx.lineTo(w.x,w.y2);ctx.stroke();ctx.strokeStyle='#4bd8e7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w.x,w.y1);ctx.lineTo(w.x,w.y2);ctx.stroke();ctx.fillStyle='#b4ffff';for(let y=w.y1+12;y<w.y2;y+=26)ctx.fillRect(w.x-2,y,4,3)}
for(const p of platforms){if(p.dead)continue;let flick=p.type==='unstable'&&p.crack>0&&Math.sin(performance.now()*.04)>0?0.3:1;ctx.globalAlpha=flick;ctx.fillStyle='#122d40';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle=p.type==='unstable'?'#e58bff':'#4fd9e7';ctx.fillRect(p.x,p.y,p.w,3);ctx.fillStyle='rgba(91,236,249,.14)';ctx.fillRect(p.x+5,p.y+5,p.w-10,2);if(p.type==='unstable'){ctx.strokeStyle='rgba(255,144,229,.65)';ctx.beginPath();ctx.moveTo(p.x+p.w*.4,p.y+3);ctx.lineTo(p.x+p.w*.46,p.y+10);ctx.lineTo(p.x+p.w*.53,p.y+4);ctx.stroke()}ctx.globalAlpha=1}
// rising corruption wall, with jagged top
const wallScreen=wallY;ctx.fillStyle='rgba(255,35,100,.16)';ctx.fillRect(24,wallScreen-10,928,1600);ctx.fillStyle='rgba(255,35,100,.22)';ctx.beginPath();ctx.moveTo(24,wallScreen);for(let x=24;x<=952;x+=22)ctx.lineTo(x,wallScreen+Math.sin(x*.08+elapsed*3)*5+Math.sin(x*.021)*8);ctx.lineTo(952,wallScreen+1600);ctx.lineTo(24,wallScreen+1600);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff3f7c';ctx.lineWidth=2;ctx.shadowColor='#ff145f';ctx.shadowBlur=18;ctx.beginPath();for(let x=24;x<=952;x+=10){let y=wallScreen+Math.sin(x*.08+elapsed*3)*5+Math.sin(x*.021)*8;if(x===24)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0;
// player and dash echoes
for(const t of player.trail){ctx.globalAlpha=clamp(t.life/.16,0,1)*.3;drawEntity(t.x,t.y,player.w,player.h,true)}ctx.globalAlpha=1;drawEntity(player.x,player.y,player.w,player.h,false);
for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.restore();
// HUD
ctx.fillStyle='rgba(4,10,20,.75)';roundRect(36,22,230,72,10);ctx.fill();ctx.strokeStyle='rgba(89,224,242,.25)';ctx.stroke();ctx.fillStyle='#7cecf6';ctx.font='700 11px ui-sans-serif,system-ui';ctx.letterSpacing='2px';ctx.fillText('NEVERSTILL',52,43);ctx.letterSpacing='0px';ctx.fillStyle='#d9f8ff';ctx.font='600 20px ui-sans-serif,system-ui';ctx.fillText(Math.floor(runHeight).toString().padStart(4,'0')+' m',52,70);ctx.fillStyle='#8294b4';ctx.font='11px ui-sans-serif,system-ui';ctx.fillText(formatTime(elapsed),190,70);
// dash readiness and control hints
ctx.fillStyle='rgba(4,10,20,.7)';roundRect(36,105,110,7,4);ctx.fill();ctx.fillStyle=player.dashReady?'#66f3ff':'#41566d';roundRect(36,105,110*(player.dashReady?1:Math.max(0,1-player.dashTime/.105)),7,4);ctx.fill();ctx.fillStyle='#8ca2bc';ctx.font='10px ui-sans-serif,system-ui';ctx.fillText('DASH',151,112);
if(gameState==='ready'||gameState==='over'||gameState==='paused'){ctx.fillStyle='rgba(2,6,14,.72)';ctx.fillRect(0,0,1000,vh);ctx.textAlign='center';ctx.fillStyle='#8af6ff';ctx.font='700 13px ui-sans-serif,system-ui';ctx.letterSpacing='5px';ctx.fillText(gameState==='ready'?'VERTICAL SURVIVAL':gameState==='over'?'SIGNAL LOST':'PAUSED',500,190);ctx.letterSpacing='0px';ctx.fillStyle='#f1fbff';ctx.font='800 46px ui-sans-serif,system-ui';ctx.fillText(gameState==='ready'?'NEVERSTILL':gameState==='over'?'CAUGHT BY CORRUPTION':'NEVERSTILL',500,246);ctx.fillStyle='#8ba5bd';ctx.font='14px ui-sans-serif,system-ui';ctx.fillText(gameState==='ready'?'Climb. Adapt. Stay ahead.':gameState==='over'?'You reached '+Math.floor(runHeight)+' metres in '+formatTime(elapsed):'Take a breath.',500,278);if(gameState==='over'){ctx.font='12px ui-sans-serif,system-ui';ctx.fillText('BEST HEIGHT  '+records.bestHeight+' m     BEST TIME  '+formatTime(records.bestTime)+'     RUNS  '+records.runs,500,314)}ctx.fillStyle='#071e2b';roundRect(390,350,220,48,9);ctx.fill();ctx.strokeStyle='#4edeea';ctx.stroke();ctx.fillStyle='#d8fcff';ctx.font='700 13px ui-sans-serif,system-ui';ctx.fillText(gameState==='ready'?'START CLIMBING':'TRY AGAIN',500,379);ctx.fillStyle='#8199b1';ctx.font='11px ui-sans-serif,system-ui';ctx.fillText('PRESS SPACE / ENTER OR TAP THE BUTTON',500,420);ctx.textAlign='left';}
// mobile controls
controls=[];if(W<1050||('ontouchstart'in window)){const s=scale;const cy=vh-74;controls=[{id:'left',x:85,y:cy,r:30},{id:'right',x:151,y:cy,r:30},{id:'up',x:219,y:cy-33,r:24},{id:'down',x:219,y:cy+28,r:24},{id:'jump',x:866,y:cy-6,r:35},{id:'dash',x:929,y:cy-52,r:30}];for(const c of controls){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fillStyle='rgba(16,43,62,.78)';ctx.fill();ctx.strokeStyle='rgba(101,229,242,.5)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#b7f8ff';ctx.font='700 14px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(({left:'◀',right:'▶',up:'▲',down:'▼',jump:'↑',dash:'»'})[c.id],c.x,c.y);ctx.textBaseline='alphabetic'}ctx.textAlign='left'}
ctx.restore();}
function drawEntity(x,y,w,h,ghost){ctx.save();ctx.translate(x+w/2,y+h/2);ctx.globalAlpha=ghost?.45:1;let glow=ctx.createRadialGradient(0,0,1,0,0,29);glow.addColorStop(0,'rgba(72,245,255,.26)');glow.addColorStop(1,'rgba(72,245,255,0)');ctx.fillStyle=glow;ctx.fillRect(-31,-31,62,62);ctx.rotate(Math.sin(elapsed*7)*.045);ctx.fillStyle='#122b41';ctx.strokeStyle='#79f7ff';ctx.lineWidth=1.4;ctx.shadowColor='#39efff';ctx.shadowBlur=ghost?2:12;ctx.beginPath();ctx.moveTo(-9,-17);ctx.lineTo(6,-19);ctx.lineTo(13,-7);ctx.lineTo(10,9);ctx.lineTo(1,18);ctx.lineTo(-12,10);ctx.lineTo(-14,-5);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#d6ffff';ctx.beginPath();ctx.moveTo(-4,-9);ctx.lineTo(7,-12);ctx.lineTo(4,-2);ctx.lineTo(-5,3);ctx.closePath();ctx.fill();ctx.fillStyle='#ff72d4';ctx.fillRect(-10,7,4,3);ctx.fillRect(7,10,3,4);ctx.fillStyle='#72f8ff';ctx.fillRect(-17,-3,3,5);ctx.fillRect(12,-14,4,4);ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function formatTime(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function frame(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;if(gameState==='playing')step(dt);draw();requestAnimationFrame(frame)}
function startFromPointer(x,y){if((gameState==='ready'||gameState==='over')&&x>W*.25&&x<W*.75&&y>H*.48&&y<H*.82)reset()}
canvas.addEventListener('click',e=>{if(gameState==='ready'||gameState==='over')startFromPointer(e.clientX,e.clientY)});addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&(gameState==='ready'||gameState==='over'))reset();if(e.key.toLowerCase()==='p'&&gameState==='playing')gameState='paused';else if(e.key.toLowerCase()==='p'&&gameState==='paused')gameState='playing'});
player=makePlayer();generateInitial();requestAnimationFrame(frame);
})();
</script></body></html>
