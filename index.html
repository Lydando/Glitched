<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>NEVERSTILL</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:#8294b4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;opacity:.8;white-space:nowrap}
@media (pointer:coarse){#hint{display:none}}
#rotate{display:none;position:fixed;inset:0;background:#050914;color:#d8faff;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:10}
#rotate strong{display:block;font-size:20px;margin-bottom:8px}
@media(orientation:portrait) and (max-width:700px){#rotate{display:flex}canvas,#hint{visibility:hidden}}
</style>
</head>
<body>
<canvas id="game" aria-label="Neverstill game"></canvas>
<div id="hint">A / D or ← / → · Space jump · Shift dash · W/S on wires · R restart</div>
<div id="rotate"><div><strong>Rotate your device</strong>Neverstill is designed for landscape play.</div></div>

<script>
(()=>{'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const logicalHeight=()=>562;
const touchMode=()=>W<1050||('ontouchstart'in window);
const gameplayHeight=()=>touchMode()?450:562;

const STORE='neverstill-records-v1';
let records={bestHeight:0,bestTime:0,runs:0};

try{
  records={...records,...JSON.parse(localStorage.getItem(STORE)||'{}')};
}catch{}

let keys={};
let touch={left:false,right:false,jump:false,dash:false,up:false,down:false};

addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;

  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
  }

  if(e.key.toLowerCase()==='r')reset();
});

addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

let pointers=new Map();
let controls=[];
let joystick={
  x:112,y:0,r:48,knobX:112,knobY:0,active:false
};

function screenToGame(clientX,clientY){
  const sc=H/562;
  return {x:clientX/sc,y:clientY/sc};
}

function updateTouch(){
  touch.left=false;
  touch.right=false;
  touch.jump=false;
  touch.dash=false;
  touch.up=false;
  touch.down=false;

  joystick.active=false;
  joystick.knobX=joystick.x;
  joystick.knobY=joystick.y;

  for(const p of pointers.values()){
    const pos=screenToGame(p.x,p.y);

    if(p.control==='stick'||(!p.control&&pos.x<250)){
      const dx=pos.x-p.startGX;
      const dy=pos.y-p.startGY;
      const dist=Math.hypot(dx,dy);
      const max=joystick.r*.78;
      const k=dist>max?max/dist:1;

      joystick.active=true;
      joystick.knobX=joystick.x+dx*k;
      joystick.knobY=joystick.y+dy*k;

      if(dx<-12)touch.left=true;
      if(dx>12)touch.right=true;
      if(dy<-14)touch.up=true;
      if(dy>14)touch.down=true;
    }else if(p.control==='jump'){
      touch.jump=true;
    }else if(p.control==='dash'){
      touch.dash=true;
    }
  }
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const pos=screenToGame(e.clientX,e.clientY);

  const c=controls.find(c=>
    Math.hypot(pos.x-c.x,pos.y-c.y)<c.r*1.35
  );

  const p={
    id:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    startGX:pos.x,
    startGY:pos.y,
    control:c?c.id:(pos.x<250?'stick':null)
  };

  pointers.set(e.pointerId,p);

  if(gameState==='ready'||gameState==='over'){
    startFromPointer(e.clientX,e.clientY);
  }

  updateTouch();
});

canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);

  if(p){
    p.x=e.clientX;
    p.y=e.clientY;
    updateTouch();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  updateTouch();
}

canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('lostpointercapture',endPointer);

let platforms=[],wires=[],particles=[];
let cameraY=0,wallY=0,wallSpeed=18;
let elapsed=0,runHeight=0,score=0;
let gameState='ready',last=0,shake=0;

const world={get width(){return W/(H/562)}};
let routePlatform=null;
let player;

function makePlayer(){
  return {
    x:world.width/2,y:0,vx:0,vy:0,w:25,h:36,
    onGround:false,wallSide:0,wallJumpLock:0,
    dashReady:true,dashTime:0,dashDir:1,
    climbing:false,wire:null,climbCooldown:0,
    trail:[],jumpBuffer:0,coyote:0,face:1
  };
}

function addPlatform(x,y,w,type='solid',mainRoute=false){
  const p={x,y,w,h:14,type,mainRoute,phase:Math.random()*6.28,crack:0,dead:false};
  platforms.push(p);
  return p;
}

function addWire(x,y1,y2){
  wires.push({x,y1,y2});
}

function generateInitial(){
  platforms=[];
  wires=[];
  const startW=Math.min(240,world.width-100);
  routePlatform=addPlatform((world.width-startW)/2,120,startW,'solid',true);

  // Scatter ledges across the shaft instead of arranging them into a visible staircase.
  // Vertical spacing remains within the movement envelope, but there is no obvious left-right route.
  let y=routePlatform.y;
  for(let i=0;i<22;i++){
    y-=rand(58,100);
    const pw=rand(95,175);
    const x=rand(38,Math.max(39,world.width-pw-38));
    const type=Math.random()<.10?'unstable':'solid';
    const p=addPlatform(x,y,pw,type,false);
    if(i%4===0) p.mainRoute=true;
  }

  // Wires are independent vertical opportunities, not bridges linking every ledge.
  for(let i=0;i<7;i++){
    const wy=rand(20,Math.max(21,y+100));
    const wx=rand(48,Math.max(49,world.width-48));
    addWire(wx,wy,wy+rand(75,155));
  }
  routePlatform=platforms[platforms.length-1];
}

function generateNextSection(){
  if(!routePlatform)return;
  const previous=routePlatform;
  const difficulty=Math.min(1,runHeight/2200);
  const py=previous.y-rand(58,100);
  const pw=rand(95,170)-difficulty*8;
  const x=rand(38,Math.max(39,world.width-pw-38));
  const next=addPlatform(x,py,pw,Math.random()<.12?'unstable':'solid',false);

  // Occasional independent ledges add choices without revealing a single intended path.
  if(Math.random()<.72){
    const bw=rand(80,140);
    const by=py+rand(-30,48);
    const bx=rand(32,Math.max(33,world.width-bw-32));
    addPlatform(bx,by,bw,Math.random()<.16?'unstable':'solid',false);
  }
  if(Math.random()<.28){
    const wx=rand(45,Math.max(46,world.width-45));
    addWire(wx,py-rand(15,55),py+rand(50,110));
  }
  routePlatform=next;
}

function reset(){
  player=makePlayer();
  player.x=world.width/2-player.w/2;
  player.y=60;

  cameraY=0;
  wallY=logicalHeight()+150;
  wallSpeed=18;
  elapsed=0;
  runHeight=0;
  score=0;
  shake=0;
  particles=[];

  generateInitial();

  gameState='playing';
  jumpWas=false;
  dashWas=false;

  records.runs++;
  saveRecords();
}

function saveRecords(){
  try{
    localStorage.setItem(STORE,JSON.stringify(records));
  }catch{}
}

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:rand(-170,170),
      vy:rand(-180,130),
      life:rand(.2,.65),
      max:.65,
      size:rand(1,3),
      color
    });
  }
}

function input(){
  return {
    left:keys.a||keys.arrowleft||touch.left,
    right:keys.d||keys.arrowright||touch.right,
    jump:keys[' ']||keys.w||keys.arrowup||touch.jump,
    up:keys.w||keys.arrowup||touch.up,
    down:keys.s||keys.arrowdown||touch.down,
    dash:keys.shift||keys.x||touch.dash
  };
}

let jumpWas=false,dashWas=false;

function step(dt){
  if(gameState!=='playing')return;

  elapsed+=dt;

  const inp=input();

  player.jumpBuffer=
    inp.jump&&!jumpWas
      ?.12
      :Math.max(0,player.jumpBuffer-dt);

  jumpWas=inp.jump;

  const dir=(inp.right?1:0)-(inp.left?1:0);

  if(dir)player.face=dir;

  // Find nearby wires and allow vertical climbing.
  player.climbCooldown=Math.max(0,player.climbCooldown-dt);

  if(!player.climbing){
    let near=null;
    let dist=Infinity;

    for(const w of wires){
      const d=Math.abs(player.x+player.w/2-w.x);

      if(
        d<18&&
        player.y+player.h>w.y1&&
        player.y<w.y2&&
        d<dist
      ){
        near=w;
        dist=d;
      }
    }

    if(near&&(inp.up||inp.down)&&player.climbCooldown===0){
      player.climbing=true;
      player.wire=near;
      player.vx=0;
      player.vy=0;
    }
  }

  if(player.climbing){
    if(
      !player.wire||
      player.y+player.h<player.wire.y1-2||
      player.y>player.wire.y2+4
    ){
      player.climbing=false;
      player.wire=null;
      player.climbCooldown=.18;
    }else{
      player.x+=
        (player.wire.x-(player.x+player.w/2))*
        Math.min(1,dt*16);

      player.vy=0;

      player.y+=(inp.up?-1:inp.down?1:0)*155*dt;
      // Stop at the endpoints. Reaching the top never auto-detaches the player.
      player.y=clamp(player.y,player.wire.y1-player.h,player.wire.y2);

      if(player.jumpBuffer>0){
        player.climbing=false;
        player.wire=null;
        player.vy=-410;
        player.vx=player.face*145;
        player.dashReady=true;
        player.jumpBuffer=0;

        burst(
          player.x+12,
          player.y+20,
          7,
          '#8afaff'
        );
      }
    }
  }

  if(!player.climbing){
    if(player.dashTime>0){
      player.dashTime=Math.max(0,player.dashTime-dt);
      player.vx=player.dashDir*690;
      player.vy*=.18;

      player.trail.push({
        x:player.x,
        y:player.y,
        life:.16
      });

      if(player.trail.length>12){
        player.trail.shift();
      }
    }else{
      const target=dir*245;

      player.vx+=(target-player.vx)*
        Math.min(1,dt*(dir?13:9));

      player.vy+=1000*dt;
      player.vy=Math.min(player.vy,760);

      if(
        player.jumpBuffer>0&&
        (player.onGround||player.coyote>0)
      ){
        player.vy=-430;
        player.onGround=false;
        player.coyote=0;
        player.jumpBuffer=0;

        burst(
          player.x+12,
          player.y+player.h,
          5,
          '#5ceeff'
        );
      }

      if(inp.jump&&player.vy< -70){
        player.vy-=280*dt;
      }
    }

    if(inp.dash&&!dashWas&&player.dashReady){
      player.dashReady=false;
      player.dashTime=.105;
      player.dashDir=dir||player.face;
      player.vx=player.dashDir*690;
      player.vy=0;

      burst(
        player.x+12,
        player.y+18,
        10,
        '#73f5ff'
      );
    }

    dashWas=inp.dash;

    const oldY=player.y;

    player.x+=player.vx*dt;
    if(player.wallJumpLock===-1&&player.x>64)player.wallJumpLock=0;
    if(player.wallJumpLock===1&&player.x+player.w<world.width-64)player.wallJumpLock=0;
    player.x=clamp(
      player.x,
      24,
      world.width-player.w-24
    );

    player.y+=player.vy*dt;
    player.onGround=false;
    player.wallSide=0;

    // Wall-jumping.
    if(player.x<=24){
      player.x=24;

      if(player.vx<0){
        player.wallSide=-1;

        if(player.vy>0){
          player.vy=Math.min(player.vy,160);
        }

        if(player.jumpBuffer>0&&player.wallJumpLock!==-1){
          player.wallJumpLock=-1;
          player.vx=300;
          player.vy=inp.jump?-465:-380;
          player.dashReady=true;
          player.jumpBuffer=0;
          player.wallSide=0;

          burst(player.x,player.y+18,8,'#83f7ff');
        }
      }
    }else if(player.x+player.w>=world.width-24){
      player.x=world.width-player.w-24;

      if(player.vx>0){
        player.wallSide=1;

        if(player.vy>0){
          player.vy=Math.min(player.vy,160);
        }

        if(player.jumpBuffer>0&&player.wallJumpLock!==1){
          player.wallJumpLock=1;
          player.vx=-300;
          player.vy=inp.jump?-465:-380;
          player.dashReady=true;
          player.jumpBuffer=0;
          player.wallSide=0;

          burst(
            player.x+player.w,
            player.y+18,
            8,
            '#83f7ff'
          );
        }
      }
    }

    // Platform collisions.
    for(const p of platforms){
      if(p.dead)continue;

      if(p.type==='unstable'&&p.crack>0){
        p.crack-=dt;
        if(p.crack<=0)p.dead=true;
      }

      if(
        player.vy>=0&&
        oldY+player.h<=p.y+5&&
        player.y+player.h>=p.y&&
        player.x+player.w>p.x&&
        player.x<p.x+p.w
      ){
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
        player.dashReady=true;

        if(p.type==='unstable'&&p.crack===0){
          p.crack=.55;
        }
      }
    }

    if(player.onGround){
      player.coyote=.1;
    }else{
      player.coyote=Math.max(0,player.coyote-dt);
    }

    // Extend the validated main route above the camera before the player reaches it.
    const topY=player.y-950;
    let highest=platforms.reduce((m,p)=>p.dead?m:Math.min(m,p.y),Infinity);
    while(highest>topY){
      generateNextSection();
      highest=platforms.reduce((m,p)=>p.dead?m:Math.min(m,p.y),Infinity);
    }

    platforms=platforms.filter(
      p=>p.y<player.y+H+180&&!p.dead
    );

    wires=wires.filter(
      w=>w.y2<player.y+H+200&&
         w.y1>player.y-1500
    );
  }

  runHeight=Math.max(
    runHeight,
    Math.max(0,60-player.y)
  );

  wallSpeed=Math.min(
    70,
    18+elapsed*.38+Math.floor(runHeight/500)*2.2
  );

  wallY-=wallSpeed*dt;

  if(player.y+player.h>=wallY){
    endRun();
  }

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=260*dt;
    p.life-=dt;
  }

  particles=particles.filter(p=>p.life>0);

  player.trail=player.trail.filter(
    t=>(t.life-=dt)>0
  );

  if(shake>0){
    shake=Math.max(0,shake-dt*18);
  }

  const target=player.y-gameplayHeight()*.5;

  cameraY+=(target-cameraY)*Math.min(1,dt*4.5);

  if(wallY<=player.y+player.h+35){
    endRun();
  }
}

function endRun(){
  if(gameState!=='playing')return;

  gameState='over';

  records.bestHeight=Math.max(
    records.bestHeight,
    Math.floor(runHeight)
  );

  records.bestTime=Math.max(records.bestTime,elapsed);

  saveRecords();

  burst(
    player.x+12,
    player.y+18,
    35,
    '#ff3b78'
  );

  shake=1;
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const scale=H/562;
  const viewW=W/scale;
  const viewH=H/scale;

  ctx.save();
  ctx.scale(scale,scale);

  const vh=562;
  const cam=cameraY;

  // Background.
  let g=ctx.createLinearGradient(0,0,0,vh);

  g.addColorStop(0,'#050914');
  g.addColorStop(.58,'#071425');
  g.addColorStop(1,'#0b1021');

  ctx.fillStyle=g;
  ctx.fillRect(0,0,viewW,vh);

  // Atmospheric grid and server silhouettes.
  ctx.save();
  ctx.translate(0,-(cam*.12%180));

  for(let y=-180;y<vh+180;y+=90){
    ctx.strokeStyle='rgba(57,133,173,.09)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(viewW,y);
    ctx.stroke();
  }

  for(let i=0;i<Math.ceil(viewW/118)+1;i++){
    let x=i*118+((i%2)*28);

    ctx.fillStyle='rgba(14,35,57,.7)';
    ctx.fillRect(x,0,18,vh);

    ctx.strokeStyle='rgba(63,197,219,.12)';
    ctx.strokeRect(x+4,0,10,vh);

    for(let y=40;y<vh;y+=85){
      ctx.fillStyle='rgba(69,224,245,.14)';
      ctx.fillRect(x+7,y,4,2);
    }
  }

  ctx.restore();

  // Side rails.
  for(let x of [24,world.width-48]){
    ctx.fillStyle='#0b1b2b';
    ctx.fillRect(x,0,24,vh);

    ctx.fillStyle='rgba(81,231,244,.32)';
    ctx.fillRect(x,0,2,vh);

    ctx.fillStyle='rgba(81,231,244,.08)';
    ctx.fillRect(x+5,0,2,vh);
  }

  // World objects.
  ctx.save();
  ctx.translate(0,-cam);

  for(const w of wires){
    ctx.strokeStyle='rgba(74,222,239,.18)';
    ctx.lineWidth=7;
    ctx.beginPath();
    ctx.moveTo(w.x,w.y1);
    ctx.lineTo(w.x,w.y2);
    ctx.stroke();

    ctx.strokeStyle='#4bd8e7';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(w.x,w.y1);
    ctx.lineTo(w.x,w.y2);
    ctx.stroke();

    ctx.fillStyle='#b4ffff';

    for(let y=w.y1+12;y<w.y2;y+=26){
      ctx.fillRect(w.x-2,y,4,3);
    }
  }

  for(const p of platforms){
    if(p.dead)continue;

    let flick=
      p.type==='unstable'&&
      p.crack>0&&
      Math.sin(performance.now()*.04)>0
        ?0.3
        :1;

    ctx.globalAlpha=flick;
    ctx.fillStyle='#122d40';
    ctx.fillRect(p.x,p.y,p.w,p.h);

    ctx.fillStyle=
      p.type==='unstable'?'#e58bff':'#4fd9e7';

    ctx.fillRect(p.x,p.y,p.w,3);

    ctx.fillStyle='rgba(91,236,249,.14)';
    ctx.fillRect(p.x+5,p.y+5,p.w-10,2);

    if(p.type==='unstable'){
      ctx.strokeStyle='rgba(255,144,229,.65)';
      ctx.beginPath();
      ctx.moveTo(p.x+p.w*.4,p.y+3);
      ctx.lineTo(p.x+p.w*.46,p.y+10);
      ctx.lineTo(p.x+p.w*.53,p.y+4);
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }

  // Rising corruption wall.
  const wallScreen=wallY;

  ctx.fillStyle='rgba(255,35,100,.16)';
  ctx.fillRect(24,wallScreen-10,928,1600);

  ctx.fillStyle='rgba(255,35,100,.22)';
  ctx.beginPath();
  ctx.moveTo(24,wallScreen);

  for(let x=24;x<=world.width-48;x+=22){
    ctx.lineTo(
      x,
      wallScreen+
      Math.sin(x*.08+elapsed*3)*5+
      Math.sin(x*.021)*8
    );
  }

  ctx.lineTo(world.width-48,wallScreen+1600);
  ctx.lineTo(24,wallScreen+1600);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle='#ff3f7c';
  ctx.lineWidth=2;
  ctx.shadowColor='#ff145f';
  ctx.shadowBlur=18;
  ctx.beginPath();

  for(let x=24;x<=world.width-48;x+=10){
    let y=
      wallScreen+
      Math.sin(x*.08+elapsed*3)*5+
      Math.sin(x*.021)*8;

    if(x===24)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();
  ctx.shadowBlur=0;

  // Player and dash echoes.
  for(const t of player.trail){
    ctx.globalAlpha=clamp(t.life/.16,0,1)*.3;
    drawEntity(t.x,t.y,player.w,player.h,true);
  }

  ctx.globalAlpha=1;

  drawEntity(
    player.x,
    player.y,
    player.w,
    player.h,
    false
  );

  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }

  ctx.globalAlpha=1;
  ctx.restore();

  // HUD.
  ctx.fillStyle='rgba(4,10,20,.75)';
  roundRect(36,22,230,72,10);
  ctx.fill();

  ctx.strokeStyle='rgba(89,224,242,.25)';
  ctx.stroke();

  ctx.fillStyle='#7cecf6';
  ctx.font='700 11px ui-sans-serif,system-ui';
  ctx.letterSpacing='2px';
  ctx.fillText('NEVERSTILL',52,43);

  ctx.letterSpacing='0px';
  ctx.fillStyle='#d9f8ff';
  ctx.font='600 20px ui-sans-serif,system-ui';

  ctx.fillText(
    Math.floor(runHeight).toString().padStart(4,'0')+' m',
    52,70
  );

  ctx.fillStyle='#8294b4';
  ctx.font='11px ui-sans-serif,system-ui';
  ctx.fillText(formatTime(elapsed),190,70);

  // Dash readiness.
  ctx.fillStyle='rgba(4,10,20,.7)';
  roundRect(36,105,110,7,4);
  ctx.fill();

  ctx.fillStyle=player.dashReady?'#66f3ff':'#41566d';

  roundRect(
    36,105,
    110*(player.dashReady?1:
      Math.max(0,1-player.dashTime/.105)),
    7,4
  );

  ctx.fill();

  ctx.fillStyle='#8ca2bc';
  ctx.font='10px ui-sans-serif,system-ui';
  ctx.fillText('DASH',151,112);

  // Start, pause and game-over screens.
  if(
    gameState==='ready'||
    gameState==='over'||
    gameState==='paused'
  ){
    ctx.fillStyle='rgba(2,6,14,.72)';
    ctx.fillRect(0,0,viewW,vh);

    const menuOffset=(vh-562)/2;
    const menuX=viewW/2;
    ctx.textAlign='center';
    ctx.fillStyle='#8af6ff';
    ctx.font='700 13px ui-sans-serif,system-ui';
    ctx.letterSpacing='5px';

    ctx.fillText(
      gameState==='ready'
        ?''
        :gameState==='over'
          ?'SIGNAL LOST'
          :'PAUSED',
      menuX,190+menuOffset
    );

    ctx.letterSpacing='0px';
    ctx.fillStyle='#f1fbff';
    ctx.font=gameState==='over'?'800 48px ui-sans-serif,system-ui':'800 46px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='over'
        ?'CAPTURED'
        :'NEVERSTILL',
      menuX,246+menuOffset
    );

    ctx.fillStyle='#8ba5bd';
    ctx.font='14px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='ready'
        ?'Climb. Adapt. Stay ahead.'
        :gameState==='over'
          ?'You reached '+Math.floor(runHeight)+
            ' metres in '+formatTime(elapsed)
          :'Take a breath.',
      menuX,278+menuOffset
    );

    if(gameState==='over'){
      ctx.font='12px ui-sans-serif,system-ui';

      ctx.fillText(
        'BEST HEIGHT  '+records.bestHeight+
        ' m     BEST TIME  '+formatTime(records.bestTime)+
        '     RUNS  '+records.runs,
        menuX,314+menuOffset
      );
    }

    ctx.fillStyle='#071e2b';
    roundRect(menuX-110,350+menuOffset,220,48,9);
    ctx.fill();

    ctx.strokeStyle='#4edeea';
    ctx.stroke();

    ctx.fillStyle='#d8fcff';
    ctx.font='700 13px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='ready'?'START CLIMBING':'TRY AGAIN',
      menuX,379+menuOffset
    );

    ctx.fillStyle='#8199b1';
    ctx.font='11px ui-sans-serif,system-ui';

    ctx.fillText(
      'PRESS SPACE / ENTER OR TAP THE BUTTON',
      menuX,420+menuOffset
    );

    ctx.textAlign='left';
  }

  // Mobile controls.
  controls=[];

  if(touchMode()){
    const stripY=450;
    const cy=508;
    // Controls float over the live game view; no separate black control bar.

    joystick.x=115;
    joystick.y=cy;
    joystick.r=43;

    controls=[
      {id:'stick',x:joystick.x,y:cy,r:joystick.r},
      {id:'jump',x:viewW-190,y:cy,r:43},
      {id:'dash',x:viewW-88,y:cy,r:39}
    ];

    // Circular analogue joystick.
    ctx.beginPath();
    ctx.arc(joystick.x,cy,joystick.r,0,Math.PI*2);
    ctx.fillStyle='rgba(16,43,62,.68)';
    ctx.fill();

    ctx.strokeStyle='rgba(101,229,242,.65)';
    ctx.lineWidth=2;
    ctx.stroke();

    // Movable inner knob.
    ctx.beginPath();
    ctx.arc(
      joystick.knobX,
      joystick.knobY,
      21,0,Math.PI*2
    );

    ctx.fillStyle=joystick.active
      ?'rgba(102,243,255,.72)'
      :'rgba(101,229,242,.32)';

    ctx.fill();

    ctx.strokeStyle='rgba(190,252,255,.8)';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Jump and dash buttons.
    for(const c of controls.filter(c=>c.id!=='stick')){
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);

      ctx.fillStyle='rgba(16,43,62,.82)';
      ctx.fill();

      ctx.strokeStyle='rgba(101,229,242,.65)';
      ctx.lineWidth=1.5;
      ctx.stroke();

      ctx.fillStyle='#d5fcff';
      ctx.font='700 14px ui-sans-serif,system-ui';
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.fillText(
        c.id==='jump'?'JUMP':'DASH',
        c.x,c.y
      );

      ctx.textBaseline='alphabetic';
    }

    ctx.textAlign='left';
  }

  ctx.restore();
}

function drawEntity(x,y,w,h,ghost){
  ctx.save();

  ctx.translate(x+w/2,y+h/2);
  ctx.globalAlpha=ghost?.45:1;

  let glow=ctx.createRadialGradient(0,0,1,0,0,29);
  glow.addColorStop(0,'rgba(72,245,255,.26)');
  glow.addColorStop(1,'rgba(72,245,255,0)');

  ctx.fillStyle=glow;
  ctx.fillRect(-31,-31,62,62);

  ctx.rotate(Math.sin(elapsed*7)*.045);

  ctx.fillStyle='#122b41';
  ctx.strokeStyle='#79f7ff';
  ctx.lineWidth=1.4;
  ctx.shadowColor='#39efff';
  ctx.shadowBlur=ghost?2:12;

  ctx.beginPath();
  ctx.moveTo(-9,-17);
  ctx.lineTo(6,-19);
  ctx.lineTo(13,-7);
  ctx.lineTo(10,9);
  ctx.lineTo(1,18);
  ctx.lineTo(-12,10);
  ctx.lineTo(-14,-5);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.fillStyle='#d6ffff';

  ctx.beginPath();
  ctx.moveTo(-4,-9);
  ctx.lineTo(7,-12);
  ctx.lineTo(4,-2);
  ctx.lineTo(-5,3);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='#ff72d4';
  ctx.fillRect(-10,7,4,3);
  ctx.fillRect(7,10,3,4);

  ctx.fillStyle='#72f8ff';
  ctx.fillRect(-17,-3,3,5);
  ctx.fillRect(12,-14,4,4);

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function formatTime(t){
  let m=Math.floor(t/60);
  let s=Math.floor(t%60);

  return String(m).padStart(2,'0')+':'+
         String(s).padStart(2,'0');
}

function frame(t){
  let dt=Math.min(.032,(t-last)/1000||0);
  last=t;

  if(gameState==='playing')step(dt);

  draw();
  requestAnimationFrame(frame);
}

function startFromPointer(x,y){
  if(
    (gameState==='ready'||gameState==='over')&&
    x>W*.25&&x<W*.75&&
    y>H*.48&&y<H*.82
  ){
    reset();
  }
}

canvas.addEventListener('click',e=>{
  if(gameState==='ready'||gameState==='over'){
    startFromPointer(e.clientX,e.clientY);
  }
});

addEventListener('keydown',e=>{
  if(
    (e.key==='Enter'||e.key===' ')&&
    (gameState==='ready'||gameState==='over')
  ){
    reset();
  }

  if(e.key.toLowerCase()==='p'&&gameState==='playing'){
    gameState='paused';
  }else if(
    e.key.toLowerCase()==='p'&&gameState==='paused'
  ){
    gameState='playing';
  }
});

player=makePlayer();
generateInitial();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
