<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050914">
<title>Glitched</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:#8294b4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;opacity:.8;white-space:nowrap}
@media (pointer:coarse){#hint{display:none}}
#rotate{display:none;position:fixed;inset:0;background:#050914;color:#d8faff;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:10}
#rotate strong{display:block;font-size:20px;margin-bottom:8px}
@media(orientation:portrait) and (max-width:700px){#rotate{display:flex}canvas,#hint{visibility:hidden}}
</style>
</head>
<body>
<canvas id="game" aria-label="Glitch game"></canvas>
<div id="hint">A / D or ← / → · Space jump · Shift dash · W/S on wires · R restart</div>
<div id="rotate"><div><strong>Rotate your device</strong>Glitched is designed for landscape play.</div></div>

<script>
(()=>{'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

// Player is drawn procedurally as a faceted glitch entity; no external avatar sprite is loaded.
let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
  // Keep high-DPI sharpness while avoiding a 2x backing store on phones.
  // DPR 1.5 cuts the pixel workload by 44% versus DPR 2, with little visible loss.
  DPR=Math.min(devicePixelRatio||1,('ontouchstart' in window || innerWidth<900)?1.5:2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const logicalHeight=()=>562;
const touchMode=()=>W<1050||('ontouchstart'in window);
const gameplayHeight=()=>touchMode()?450:562;

const STORE='neverstill-records-v1';
let records={bestHeight:0,bestTime:0,runs:0};

try{
  records={...records,...JSON.parse(localStorage.getItem(STORE)||'{}')};
}catch{}

let keys={};
let touch={left:false,right:false,jump:false,dash:false,up:false,down:false};

addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;

  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
  }

  if(e.key.toLowerCase()==='r')reset();
});

addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

let pointers=new Map();
let controls=[];
let joystick={
  x:112,y:0,r:48,knobX:112,knobY:0,active:false
};

function screenToGame(clientX,clientY){
  const sc=H/562;
  return {x:clientX/sc,y:clientY/sc};
}

function updateTouch(){
  touch.left=false;
  touch.right=false;
  touch.jump=false;
  touch.dash=false;
  touch.up=false;
  touch.down=false;

  joystick.active=false;
  joystick.knobX=joystick.x;
  joystick.knobY=joystick.y;

  for(const p of pointers.values()){
    const pos=screenToGame(p.x,p.y);

    if(p.control==='stick'||(!p.control&&pos.x<250)){
      const dx=pos.x-p.startGX;
      const dy=pos.y-p.startGY;
      const dist=Math.hypot(dx,dy);
      const max=joystick.r*.78;
      const k=dist>max?max/dist:1;

      joystick.active=true;
      joystick.knobX=joystick.x+dx*k;
      joystick.knobY=joystick.y+dy*k;

      if(dx<-12)touch.left=true;
      if(dx>12)touch.right=true;
      if(dy<-14)touch.up=true;
      if(dy>14)touch.down=true;
    }else if(p.control==='jump'){
      touch.jump=true;
    }else if(p.control==='dash'){
      touch.dash=true;
    }
  }
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const pos=screenToGame(e.clientX,e.clientY);

  const c=controls.find(c=>
    Math.hypot(pos.x-c.x,pos.y-c.y)<c.r*1.35
  );

  const p={
    id:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    startGX:pos.x,
    startGY:pos.y,
    control:c?c.id:(pos.x<250?'stick':null)
  };

  pointers.set(e.pointerId,p);

  if(gameState==='ready'||gameState==='over'){
    startFromPointer(e.clientX,e.clientY);
  }

  updateTouch();
});

canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);

  if(p){
    p.x=e.clientX;
    p.y=e.clientY;
    updateTouch();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  updateTouch();
}

canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('lostpointercapture',endPointer);

let platforms=[],wires=[],particles=[],arenaSections=[];
let cameraY=0,wallY=0,wallSpeed=18;
let elapsed=0,runHeight=0,score=0;
let gameState='ready',last=0,shake=0;

const world={get width(){return W/(H/562)}};
let routePlatform=null;

// Every run gets a fresh, unseeded sequence of shaft shapes. Transitions blend
// over 110 world units so the playable space changes without snapping.
const ARENA_SECTION_HEIGHT=520;
function ensureArenaSection(index){
  while(arenaSections.length<=index){
    const maxTotal=Math.max(80,Math.min(150,world.width-360));
    let left=rand(0,maxTotal*.62),right=rand(0,maxTotal*.62);
    if(left+right>maxTotal){const k=maxTotal/(left+right);left*=k;right*=k;}
    if(Math.random()<.28){left*=.25;right*=.25;}
    arenaSections.push({left,right});
  }
}
function arenaBoundsAt(y){
  const depth=Math.max(0,-y);
  const index=Math.floor(depth/ARENA_SECTION_HEIGHT);
  const local=depth-index*ARENA_SECTION_HEIGHT;
  ensureArenaSection(index);
  const current=arenaSections[index];
  const previous=index>0?arenaSections[index-1]:{left:0,right:0};
  const blend=clamp(local/110,0,1);
  return {
    left:24+previous.left+(current.left-previous.left)*blend,
    right:world.width-24-(previous.right+(current.right-previous.right)*blend)
  };
}
let routeFrontier=[];
let lastSpawnedLedge=null;
let player;

function makePlayer(){
  return {
    x:world.width/2,y:0,vx:0,vy:0,w:25,h:36,
    onGround:false,wallSide:0,wallJumpLock:0,
    dashReady:true,dashTime:0,dashDir:1,
    climbing:false,wire:null,climbCooldown:0,
    trail:[],jumpBuffer:0,coyote:0,face:1,
    jumpAnim:0,wallPushAnim:0,dashVisual:0,landAnim:0
  };
}

function addPlatform(x,y,w,type='solid',mainRoute=false){
  const p={x,y,w,h:14,type,mainRoute,phase:Math.random()*6.28,crack:0,dead:false};
  platforms.push(p);
  lastSpawnedLedge=p;
  return p;
}

function addWire(x,y1,y2,kind='cable'){
  wires.push({x,y1,y2,kind});
}

function platformZone(x,w){
  const edge=34;
  const zoneW=(world.width-2*edge)/6;
  return clamp(Math.floor(((x+w/2)-edge)/zoneW),0,5);
}

function violatesPreviousSpawnZone(x,w,y,ignore=null){
  if(!lastSpawnedLedge||lastSpawnedLedge===ignore||lastSpawnedLedge.dead)return false;
  const sameOrAdjacent=Math.abs(platformZone(x,w)-platformZone(lastSpawnedLedge.x,lastSpawnedLedge.w))<=1;
  const stacked=Math.abs(y-lastSpawnedLedge.y)<112 &&
    x<lastSpawnedLedge.x+lastSpawnedLedge.w+14 &&
    x+w>lastSpawnedLedge.x-14;
  return sameOrAdjacent||stacked;
}

function reachablePlatformX(previous,pw,step=0,zoneHint=null,y=0){
  const bounds=arenaBoundsAt(y), edge=bounds.left+10;
  const maxX=Math.max(edge,bounds.right-pw-10);
  const prevCenter=previous.x+previous.w/2;
  const maxHorizontal=156;
  const lo=Math.max(edge,prevCenter-maxHorizontal-pw/2);
  const hi=Math.min(maxX,prevCenter+maxHorizontal-pw/2);
  if(hi<lo)return null;
  const candidates=[];
  for(let i=0;i<320;i++){
    const x=rand(lo,hi);
    const stacked=platforms.some(p=>!p.dead&&Math.abs(p.y-y)<112&&
      x<p.x+p.w+14&&x+pw>p.x-14);
    if(stacked)continue;
    const zone=platformZone(x,pw);
    const previousZone=lastSpawnedLedge&&!lastSpawnedLedge.dead
      ?platformZone(lastSpawnedLedge.x,lastSpawnedLedge.w):-1;
    // Prefer a zone at least one full zone away from the immediate previous
    // ledge. Reachability takes priority if the shaft geometry makes that impossible.
    const spreadPenalty=previousZone>=0&&Math.abs(zone-previousZone)<=1?90:0;
    const edgeDistance=Math.min(x-edge,maxX-x);
    const edgePenalty=edgeDistance<24?(24-edgeDistance)*1.2:0;
    const zonePenalty=zoneHint===null?0:(zone===zoneHint?0:12);
    const horizontal=Math.abs(x+pw/2-prevCenter);
    candidates.push({x,score:spreadPenalty+edgePenalty+horizontal*.10+zonePenalty+rand(0,22),zone});
  }
  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.score-b.score);
  const best=candidates.slice(0,Math.min(35,candidates.length));
  // Prefer valid spread candidates whenever any exist.
  const spread=best.filter(c=>!lastSpawnedLedge||lastSpawnedLedge.dead||Math.abs(c.zone-platformZone(lastSpawnedLedge.x,lastSpawnedLedge.w))>1);
  const pool=spread.length?spread:best;
  return pool[Math.floor(Math.random()*pool.length)].x;
}

function addOptionalBranch(main,step){
  // Every optional spawn is weighted: 30% climbing vine, 70% extra ledge.
  // These are bonuses/alternatives; the guaranteed main-route ledges remain
  // available so a vine roll can never make upward progress impossible.
  if(Math.random()>.40)return;
  if(Math.random()<.50){
    const bounds=arenaBoundsAt(main.y);
    const wx=clamp(main.x+rand(-35,main.w+35),bounds.left+18,bounds.right-18);
    const y1=main.y-rand(18,42);
    addWire(wx,y1,y1+rand(70,125),'chain');
    return;
  }
  const bw=rand(68,104), bounds=arenaBoundsAt(main.y), edge=bounds.left+10;
  const maxX=Math.max(edge,bounds.right-bw-10);
  for(let attempt=0;attempt<60;attempt++){
    const bx=rand(edge,maxX);
    const by=main.y+rand(-22,28);
    const sameBandOverlap=platforms.some(p=>!p.dead&&Math.abs(p.y-by)<20&&bx<p.x+p.w+22&&bx+bw>p.x-22);
    if(sameBandOverlap||violatesPreviousSpawnZone(bx,bw,by,main))continue;
    addPlatform(bx,by,bw,Math.random()<.07?'unstable':'solid',false);
    return;
  }
}

function chooseFrontierSource(){
  const candidates=routeFrontier.filter(p=>p&&!p.dead);
  if(!candidates.length)return routePlatform;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function makeReachablePlatform(source,y,pw,usedZones,step){
  const bounds=arenaBoundsAt(y), edge=bounds.left+10;
  const zoneW=Math.max(1,(bounds.right-bounds.left-20)/4);
  const sourceZone=clamp(Math.floor(((source.x+source.w/2)-edge)/zoneW),0,3);
  let hints=[0,1,2,3].filter(z=>z!==sourceZone&&!usedZones.has(z));
  if(!hints.length)hints=[0,1,2,3].filter(z=>z!==sourceZone);
  // Retry fresh positions instead of forcing an invalid/stacked placement.
  for(let attempt=0;attempt<10;attempt++){
    const hint=hints.length?hints[Math.floor(Math.random()*hints.length)]:null;
    const x=reachablePlatformX(source,pw,step,hint,y);
    if(x!==null)return addPlatform(x,y,pw,Math.random()<.10?'unstable':'solid',true);
  }
  // Last-resort safe fallback: search broad positions and preserve the no-stack rule.
  const bounds=arenaBoundsAt(y), edge=bounds.left+10;
  const maxX=Math.max(edge,bounds.right-pw-10);
  for(let i=0;i<180;i++){
    const x=rand(edge,maxX);
    const dx=Math.abs((x+pw/2)-(source.x+source.w/2));
    const stacked=platforms.some(p=>!p.dead&&Math.abs(p.y-y)<112&&x<p.x+p.w+14&&x+pw>p.x-14);
    if(dx<=156&&!stacked)return addPlatform(x,y,pw,'solid',true);
  }
  // Final fallback preserves reachable movement and avoids copying the prior
  // ledge's zone where possible. Keep the guaranteed route rather than dead-ending.
  const fallbackBounds=arenaBoundsAt(y-18), fallbackEdge=fallbackBounds.left+10;
  const fallbackMaxX=Math.max(fallbackEdge,fallbackBounds.right-pw-10);
  for(let i=0;i<240;i++){
    const x=rand(fallbackEdge,fallbackMaxX);
    const dx=Math.abs((x+pw/2)-(source.x+source.w/2));
    const stacked=platforms.some(p=>!p.dead&&Math.abs(p.y-(y-18))<112&&x<p.x+p.w+14&&x+pw>p.x-14);
    if(dx<=156&&!stacked)return addPlatform(x,y-18,pw,'solid',true);
  }
  const finalBounds=arenaBoundsAt(y-36);
  return addPlatform(clamp(source.x+source.w/2-pw/2,finalBounds.left+10,finalBounds.right-pw-10),y-36,pw,'solid',true);
}

function generateInitial(){
  platforms=[];
  wires=[];
  arenaSections=[{left:0,right:0}];
  routeFrontier=[];
  lastSpawnedLedge=null;
  const startW=Math.min(220,world.width-68);
  const start=addPlatform((world.width-startW)/2,120,startW,'solid',true);
  routePlatform=start;
  routeFrontier=[start];
  let baseY=start.y;
  // Build overlapping layers. Each layer has 2-3 upward choices; sources are
  // drawn from the whole previous layer, not a single mandatory spine.
  for(let layer=0;layer<6;layer++){
    baseY-=rand(88,102);
    const nextLayer=[];
    const usedZones=new Set();
    const count=2;
    for(let j=0;j<count;j++){
      const source=chooseFrontierSource()||start;
      const pw=rand(106,148);
      const p=makeReachablePlatform(source,baseY+rand(-8,8),pw,usedZones,layer*3+j);
      nextLayer.push(p);
      const zoneW=(world.width-68)/4;
      usedZones.add(clamp(Math.floor(((p.x+p.w/2)-34)/zoneW),0,3));
      addOptionalBranch(p,layer*3+j);
    }
    // Keep each generated layer connected to at least one previous layer node.
    // A failed/overlapping sample is still reachable because it was sampled
    // from a reachable interval; the next layer can branch from any node here.
    routeFrontier=nextLayer;
    routePlatform=nextLayer[Math.floor(Math.random()*nextLayer.length)];
  }
  const topY=Math.min(...routeFrontier.map(p=>p.y));
  for(let i=0;i<2;i++){
    const t=(i+1)/3;
    const wy=120+(topY-120)*t+rand(-30,30);
    const bounds=arenaBoundsAt(wy);
    const wx=rand(bounds.left+24,Math.max(bounds.left+25,bounds.right-24));
    addWire(wx,wy,wy+rand(75,130),'chain');
  }
}

function generateNextSection(){
  if(!routeFrontier.length&&routePlatform)routeFrontier=[routePlatform];
  if(!routeFrontier.length)return;
  const difficulty=Math.min(1,runHeight/2200);
  const sourceLayer=routeFrontier.filter(p=>p&&!p.dead);
  if(!sourceLayer.length)return;
  const baseY=Math.min(...sourceLayer.map(p=>p.y))-rand(88,102);
  const nextLayer=[];
  const usedZones=new Set();
  // 2-3 real upward choices per layer. Each is sampled from a reachable
  // source platform, so the player is not forced onto one generated sequence.
  const count=2;
  for(let i=0;i<count;i++){
    const source=sourceLayer[Math.floor(Math.random()*sourceLayer.length)];
    const pw=rand(106,148)-difficulty*4;
    const p=makeReachablePlatform(source,baseY+rand(-8,8),pw,usedZones,Math.floor(runHeight/75)*3+i);
    nextLayer.push(p);
    const zoneW=(world.width-68)/4;
    usedZones.add(clamp(Math.floor(((p.x+p.w/2)-34)/zoneW),0,3));
    addOptionalBranch(p,Math.floor(runHeight/75)*3+i);
  }
  routeFrontier=nextLayer;
  routePlatform=nextLayer[Math.floor(Math.random()*nextLayer.length)];
  if(Math.random()<.05){
    const wx=rand(45,Math.max(46,world.width-45));
    addWire(wx,baseY-rand(20,42),baseY+rand(45,85));
  }
}

function reset(){
  player=makePlayer();
  player.x=world.width/2-player.w/2;
  player.y=60;

  cameraY=0;
  wallY=logicalHeight()+150;
  wallSpeed=18;
  elapsed=0;
  runHeight=0;
  score=0;
  shake=0;
  particles=[];

  generateInitial();

  gameState='playing';
  jumpWas=false;
  dashWas=false;

  records.runs++;
  saveRecords();
}

function saveRecords(){
  try{
    localStorage.setItem(STORE,JSON.stringify(records));
  }catch{}
}

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:rand(-170,170),
      vy:rand(-180,130),
      life:rand(.2,.65),
      max:.65,
      size:rand(1,3),
      color
    });
  }
}

function input(){
  return {
    left:keys.a||keys.arrowleft||touch.left,
    right:keys.d||keys.arrowright||touch.right,
    jump:keys[' ']||keys.w||keys.arrowup||touch.jump,
    up:keys.w||keys.arrowup||touch.up,
    down:keys.s||keys.arrowdown||touch.down,
    dash:keys.shift||keys.x||touch.dash
  };
}

let jumpWas=false,dashWas=false;

function step(dt){
  if(gameState!=='playing')return;

  elapsed+=dt;

  // Visual-only animation clocks. These never feed back into movement physics.
  player.jumpAnim=Math.max(0,player.jumpAnim-dt);
  player.wallPushAnim=Math.max(0,player.wallPushAnim-dt);
  player.dashVisual=Math.max(0,player.dashVisual-dt);
  player.landAnim=Math.max(0,player.landAnim-dt);

  const inp=input();

  player.jumpBuffer=
    inp.jump&&!jumpWas
      ?.12
      :Math.max(0,player.jumpBuffer-dt);

  jumpWas=inp.jump;

  const dir=(inp.right?1:0)-(inp.left?1:0);

  if(dir)player.face=dir;

  // Find nearby wires and allow vertical climbing.
  player.climbCooldown=Math.max(0,player.climbCooldown-dt);

  if(!player.climbing){
    let near=null;
    let dist=Infinity;

    for(const w of wires){
      const d=Math.abs(player.x+player.w/2-w.x);

      if(
        d<18&&
        player.y+player.h>w.y1&&
        player.y<w.y2&&
        d<dist
      ){
        near=w;
        dist=d;
      }
    }

    if(near&&(inp.up||inp.down)&&player.climbCooldown===0){
      player.climbing=true;
      player.wire=near;
      player.vx=0;
      player.vy=0;
    }
  }

  if(player.climbing){
    if(
      !player.wire||
      player.y+player.h<player.wire.y1-2||
      player.y>player.wire.y2+4
    ){
      player.climbing=false;
      player.wire=null;
      player.climbCooldown=.18;
    }else{
      player.x+=
        (player.wire.x-(player.x+player.w/2))*
        Math.min(1,dt*16);

      player.vy=0;

      player.y+=(inp.up?-1:inp.down?1:0)*155*dt;
      // Stop at the endpoints. Reaching the top never auto-detaches the player.
      player.y=clamp(player.y,player.wire.y1-player.h,player.wire.y2);

      if(player.jumpBuffer>0){
        player.climbing=false;
        player.wire=null;
        player.vy=-410;
        player.vx=player.face*145;
        player.dashReady=true;
        player.wallJumpLock=0;
        player.jumpBuffer=0;

        burst(
          player.x+12,
          player.y+20,
          7,
          '#8afaff'
        );
      }
    }
  }

  if(!player.climbing){
    if(player.dashTime>0){
      player.dashTime=Math.max(0,player.dashTime-dt);
      player.vx=player.dashDir*690;
      player.vy*=.18;

      player.trail.push({
        x:player.x,
        y:player.y,
        life:.16
      });

      if(player.trail.length>12){
        player.trail.shift();
      }
    }else{
      const target=dir*245;

      player.vx+=(target-player.vx)*
        Math.min(1,dt*(dir?13:9));

      player.vy+=1000*dt;
      player.vy=Math.min(player.vy,760);

      if(
        player.jumpBuffer>0&&
        (player.onGround||player.coyote>0)
      ){
        player.vy=-430;
        player.jumpAnim=.24;
        player.onGround=false;
        player.coyote=0;
        player.jumpBuffer=0;

        burst(
          player.x+12,
          player.y+player.h,
          5,
          '#5ceeff'
        );
      }

      if(inp.jump&&player.vy< -70){
        player.vy-=280*dt;
      }
    }

    if(inp.dash&&!dashWas&&player.dashReady){
      player.dashReady=false;
      player.dashTime=.105;
      player.dashVisual=.27;
      player.dashDir=dir||player.face;
      player.vx=player.dashDir*690;
      player.vy=0;

      burst(
        player.x+12,
        player.y+18,
        10,
        '#73f5ff'
      );
    }

    dashWas=inp.dash;

    const oldY=player.y;

    player.x+=player.vx*dt;
    const movementBounds=arenaBoundsAt(player.y+player.h*.5);
    player.x=clamp(player.x,movementBounds.left,movementBounds.right-player.w);

    player.y+=player.vy*dt;
    player.onGround=false;
    player.wallSide=0;

    // Wall-jumping.
    const wallBounds=arenaBoundsAt(player.y+player.h*.5);
    if(player.x<=wallBounds.left){
      player.x=wallBounds.left;

      if(player.vx<0){
        player.wallSide=-1;

        if(player.vy>0){
          player.vy=Math.min(player.vy,160);
        }

        if(player.jumpBuffer>0&&player.wallJumpLock!==-1){
          player.wallJumpLock=-1;
          player.vx=300;
          player.vy=inp.jump?-465:-380;
          player.wallPushAnim=.22;
          player.jumpAnim=.24;
          player.dashReady=true;
          player.jumpBuffer=0;
          player.wallSide=0;

          burst(player.x,player.y+18,8,'#83f7ff');
        }
      }
    }else if(player.x+player.w>=wallBounds.right){
      player.x=wallBounds.right-player.w;

      if(player.vx>0){
        player.wallSide=1;

        if(player.vy>0){
          player.vy=Math.min(player.vy,160);
        }

        if(player.jumpBuffer>0&&player.wallJumpLock!==1){
          player.wallJumpLock=1;
          player.vx=-300;
          player.vy=inp.jump?-465:-380;
          player.wallPushAnim=.22;
          player.jumpAnim=.24;
          player.dashReady=true;
          player.jumpBuffer=0;
          player.wallSide=0;

          burst(
            player.x+player.w,
            player.y+18,
            8,
            '#83f7ff'
          );
        }
      }
    }

    // Platform collisions.
    for(const p of platforms){
      if(p.dead)continue;

      if(p.type==='unstable'&&p.crack>0){
        p.crack-=dt;
        if(p.crack<=0)p.dead=true;
      }

      if(
        player.vy>=0&&
        oldY+player.h<=p.y+5&&
        player.y+player.h>=p.y&&
        player.x+player.w>p.x&&
        player.x<p.x+p.w
      ){
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
        player.dashReady=true;
        player.wallJumpLock=0;

        if(p.type==='unstable'&&p.crack===0){
          p.crack=.55;
        }
      }
    }

    if(player.onGround){
      player.coyote=.1;
    }else{
      player.coyote=Math.max(0,player.coyote-dt);
    }

    // Extend the validated main route above the camera before the player reaches it.
    const topY=player.y-950;
    let highest=platforms.reduce((m,p)=>p.dead?m:Math.min(m,p.y),Infinity);
    while(highest>topY){
      generateNextSection();
      highest=platforms.reduce((m,p)=>p.dead?m:Math.min(m,p.y),Infinity);
    }

    platforms=platforms.filter(
      p=>p.y<player.y+H+180&&!p.dead
    );

    wires=wires.filter(
      w=>w.y2<player.y+H+200&&
         w.y1>player.y-1500
    );
  }

  runHeight=Math.max(
    runHeight,
    Math.max(0,60-player.y)
  );

  // The corruption wall should remain a real pressure source without
  // outrunning fair platforming. It starts noticeably quicker and ramps
  // steadily with survival time and height, with a firm late-run cap.
  wallSpeed=Math.min(
    100,
    70+elapsed*.44+Math.floor(runHeight/300)*2.4
  );

  wallY-=wallSpeed*dt;

  if(player.y+player.h>=wallY){
    endRun();
  }

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=260*dt;
    p.life-=dt;
  }

  particles=particles.filter(p=>p.life>0);

  player.trail=player.trail.filter(
    t=>(t.life-=dt)>0
  );

  if(shake>0){
    shake=Math.max(0,shake-dt*18);
  }

  const target=player.y-gameplayHeight()*.5;

  cameraY+=(target-cameraY)*Math.min(1,dt*4.5);

  if(wallY<=player.y+player.h+35){
    endRun();
  }
}

function endRun(){
  if(gameState!=='playing')return;

  gameState='over';

  records.bestHeight=Math.max(
    records.bestHeight,
    Math.floor(runHeight)
  );

  records.bestTime=Math.max(records.bestTime,elapsed);

  saveRecords();

  burst(
    player.x+12,
    player.y+18,
    35,
    '#ff3b78'
  );

  shake=1;
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const scale=H/562;
  const viewW=W/scale;
  const viewH=H/scale;

  ctx.save();
  ctx.scale(scale,scale);

  const vh=562;
  const cam=cameraY;

  // Detailed procedural megastructure. Architecture is drawn from reusable
  // deterministic modules so windows, damage and bridge pieces stay stable
  // while the camera scrolls. Decorative only; gameplay geometry is untouched.
  const decay=clamp(runHeight/3000,0,1);
  const fracture=clamp((runHeight-850)/1900,0,1);
  const voidness=clamp((runHeight-2100)/1500,0,1);
  const noise=(n)=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v);};
  const cycle=680;
  let g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,'#030610');
  g.addColorStop(.48,decay<.5?'#081a2a':'#080d1b');
  g.addColorStop(1,voidness>.5?'#04050c':'#0a1726');
  ctx.fillStyle=g;ctx.fillRect(0,0,viewW,vh);

  const haze=ctx.createRadialGradient(viewW*.52,vh*.42,8,viewW*.52,vh*.42,viewW*.72);
  haze.addColorStop(0,`rgba(20,91,117,${.15*(1-voidness)+.025})`);
  haze.addColorStop(.65,`rgba(9,26,49,${.18*(1-voidness)})`);
  haze.addColorStop(1,'rgba(1,3,9,0)');
  ctx.fillStyle=haze;ctx.fillRect(0,0,viewW,vh);

  // Cyan/pink atmospheric light lives BEHIND the architecture. The broad,
  // overlapping gradients create depth without washing out the playable area.
  const cyanGlow=ctx.createRadialGradient(viewW*.28,vh*.39,2,viewW*.28,vh*.39,viewW*.48);
  cyanGlow.addColorStop(0,`rgba(28,205,232,${.115+decay*.035})`);
  cyanGlow.addColorStop(.38,`rgba(16,111,153,${.085+fracture*.025})`);
  cyanGlow.addColorStop(1,'rgba(5,20,38,0)');
  ctx.fillStyle=cyanGlow;ctx.fillRect(0,0,viewW,vh);
  const pinkGlow=ctx.createRadialGradient(viewW*.78,vh*.55,1,viewW*.78,vh*.55,viewW*.43);
  pinkGlow.addColorStop(0,`rgba(255,54,151,${.045+fracture*.085+voidness*.055})`);
  pinkGlow.addColorStop(.42,`rgba(166,38,126,${.035+fracture*.035+voidness*.035})`);
  pinkGlow.addColorStop(1,'rgba(18,5,25,0)');
  ctx.fillStyle=pinkGlow;ctx.fillRect(0,0,viewW,vh);
  // A few irregular vertical shafts make the haze feel like light between towers.
  for(let i=0;i<5;i++){
    const sx=noise(8100+i)*viewW;
    const sw=18+noise(8200+i)*54;
    const sg=ctx.createLinearGradient(sx,0,sx+sw,0);
    const tint=i%2===0?'75,220,245':'255,69,165';
    sg.addColorStop(0,`rgba(${tint},0)`);
    sg.addColorStop(.5,`rgba(${tint},${.018+fracture*.012})`);
    sg.addColorStop(1,`rgba(${tint},0)`);
    ctx.fillStyle=sg;ctx.fillRect(sx,0,sw,vh);
  }

  // Far towers: facade panels, floor bands, individual windows and antennae.
  ctx.save();ctx.translate(0,-((cam*.10)%cycle));
  for(let layer=-1;layer<2;layer++){
    const off=layer*cycle;
    for(let i=0;i<Math.ceil(viewW/178)+3;i++){
      const seed=100+i+layer*41;
      const x=i*178-68+(noise(seed)-.5)*48;
      const bw=66+noise(seed+1)*78;
      const bh=270+noise(seed+2)*330;
      const y=vh-bh+off;
      const alpha=.68-fracture*.35;
      ctx.fillStyle=`rgba(7,16,30,${alpha})`;
      ctx.fillRect(x,y,bw,bh);
      // Offset facade face and heavy corner columns.
      ctx.fillStyle=`rgba(22,42,59,${.55-fracture*.2})`;
      ctx.beginPath();ctx.moveTo(x+bw,y+12);ctx.lineTo(x+bw+9,y+3);ctx.lineTo(x+bw+9,y+bh-12);ctx.lineTo(x+bw,y+bh);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(49,99,121,.22)';
      ctx.fillRect(x+5,y+8,3,bh-16);ctx.fillRect(x+bw-7,y+8,3,bh-16);
      // Repeating window bays, with dark recesses and a few live/dead lights.
      const cols=Math.max(2,Math.floor((bw-18)/12));
      const rows=Math.floor((bh-24)/19);
      for(let r=0;r<rows;r++){
        const wy=y+16+r*19;
        for(let c=0;c<cols;c++){
          const wx=x+10+c*12;
          const n=noise(seed+r*19+c*7);
          ctx.fillStyle=`rgba(0,4,12,${.82})`;ctx.fillRect(wx,wy,7,11);
          ctx.fillStyle=`rgba(31,69,88,${.55})`;ctx.fillRect(wx+1,wy+1,5,1);
          if(n>.72){
            const lit=noise(seed+500+r*13+c*5)>.3;
            ctx.fillStyle=lit
              ?`rgba(73,219,235,${(.12+noise(seed+c+r)*.27)*(1-fracture*.65)})`
              :`rgba(179,102,91,${.10*(1-fracture)})`;
            ctx.fillRect(wx+1,wy+2,5,7);
          }
          if(n<.07&&fracture>.05){
            ctx.strokeStyle=`rgba(104,219,233,${fracture*.28})`;ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(wx,wy+2);ctx.lineTo(wx+3,wy+5);ctx.lineTo(wx+2,wy+10);ctx.stroke();
          }
        }
      }
      // Floor separators and service modules.
      for(let fy=y+28;fy<y+bh;fy+=76){
        ctx.fillStyle='rgba(62,112,135,.22)';ctx.fillRect(x+3,fy,bw-6,2);
        ctx.fillStyle='rgba(27,55,73,.7)';ctx.fillRect(x+12,fy+4,Math.max(8,bw-28),3);
      }
      for(let m=0;m<3;m++){
        const my=y+45+m*83+noise(seed+m)*12;
        ctx.fillStyle='rgba(16,35,51,.9)';ctx.fillRect(x-4,my,5,20);
        ctx.fillStyle='rgba(61,190,211,.24)';ctx.fillRect(x-3,my+3,2,12);
      }
      // Occasional varied facade modules: service ribs, maintenance bays and signal strips.
      const facadeVariant = Math.floor(noise(seed+21)*5);
      if(facadeVariant===0){
        ctx.fillStyle='rgba(1,6,15,.88)';ctx.fillRect(x+bw*.22,y+bh*.18,Math.max(9,bw*.48),Math.min(48,bh*.18));
        ctx.fillStyle='rgba(45,108,131,.42)';ctx.fillRect(x+bw*.22,y+bh*.18,Math.max(9,bw*.48),2);
        for(let rib=0;rib<4;rib++){
          ctx.fillStyle='rgba(57,107,126,.36)';ctx.fillRect(x+bw*.25+rib*bw*.10,y+bh*.2,2,Math.min(38,bh*.14));
        }
      } else if(facadeVariant===1){
        const bayY=y+bh*(.3+noise(seed+22)*.32);
        ctx.fillStyle='rgba(0,5,13,.92)';ctx.fillRect(x+8,bayY,bw-16,24);
        ctx.fillStyle='rgba(58,205,224,.18)';ctx.fillRect(x+9,bayY+3,bw-18,2);
        ctx.fillStyle='rgba(255,71,161,.16)';ctx.fillRect(x+9,bayY+18,bw-18,2);
      } else if(facadeVariant===2){
        ctx.strokeStyle='rgba(66,135,157,.34)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x+bw*.18,y+bh*.2);ctx.lineTo(x+bw*.82,y+bh*.35);ctx.lineTo(x+bw*.82,y+bh*.62);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+bw*.18,y+bh*.2);ctx.lineTo(x+bw*.18,y+bh*.48);ctx.stroke();
      } else if(facadeVariant===3){
        const lightY=y+bh*(.24+noise(seed+23)*.5);
        ctx.fillStyle='rgba(9,20,32,.92)';ctx.fillRect(x+bw*.68,lightY,5,Math.min(34,bh*.14));
        ctx.fillStyle='rgba(70,222,238,.52)';ctx.fillRect(x+bw*.68+1,lightY+3,2,Math.min(12,bh*.06));
      }

      // Roof crown, aerials and dish.
      ctx.fillStyle='#0a1c2b';ctx.fillRect(x-4,y,bw+8,7);
      ctx.strokeStyle=`rgba(75,189,211,${.3*(1-fracture)+.05})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x+bw*.72,y);ctx.lineTo(x+bw*.72,y-18-noise(seed)*20);ctx.lineTo(x+bw*.82,y-25-noise(seed)*20);ctx.stroke();
      ctx.beginPath();ctx.arc(x+bw*.25,y-4,5,Math.PI,Math.PI*2);ctx.stroke();
      // Broken facade bites appear as the world degrades.
      if(fracture>0){
        for(let k=0;k<Math.floor(fracture*5);k++){
          const bx=x+noise(seed+k+60)*bw, by=y+noise(seed+k+70)*bh;
          ctx.fillStyle='#050a14';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+8+noise(seed+k)*18,by-3);ctx.lineTo(bx+5,by+8+noise(seed+k+2)*14);ctx.closePath();ctx.fill();
          ctx.strokeStyle=`rgba(63,211,229,${fracture*.25})`;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+4,by+9);ctx.stroke();
        }
      }
    }
  }
  ctx.restore();

  // Midground towers and recognisable broken bridges with railings, girders,
  // hanging cables, deck plates and snapped ends.
  ctx.save();ctx.translate(0,-((cam*.24)%cycle));
  for(let layer=-1;layer<2;layer++){
    const off=layer*cycle;
    for(let i=0;i<Math.ceil(viewW/245)+2;i++){
      const seed=1200+i+layer*53;
      const x=i*245-82+(noise(seed)-.5)*55;
      const y=25+noise(seed+2)*390+off;
      const h=120+noise(seed+3)*240;
      const w=35+noise(seed+4)*50;
      ctx.fillStyle=`rgba(5,13,25,${.82-fracture*.18})`;ctx.fillRect(x,y,w,h);
      ctx.fillStyle='rgba(28,52,70,.7)';ctx.fillRect(x+5,y+8,4,h-16);ctx.fillRect(x+w-9,y+8,4,h-16);
      for(let fy=y+20;fy<y+h;fy+=31){
        ctx.fillStyle='rgba(47,92,112,.35)';ctx.fillRect(x+3,fy,w-6,2);
        for(let wx=x+8;wx<x+w-6;wx+=13){
          ctx.fillStyle=noise(seed+fy+wx)>.65?'rgba(64,210,231,.38)':'rgba(0,4,12,.8)';
          ctx.fillRect(wx,fy+5,6,9);
        }
      }
      // External cross-bracing.
      ctx.strokeStyle=`rgba(54,131,154,${.34-fracture*.12})`;ctx.lineWidth=2;
      for(let by=y+18;by<y+h-20;by+=42){
        ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x+w,by+40);ctx.moveTo(x+w,by);ctx.lineTo(x,by+40);ctx.stroke();
      }
      // Bridge span: deck slabs are separated by a real gap, with broken rails.
      if(noise(seed+5)>.15){
        const by=y+35+noise(seed+6)*Math.max(15,h-60);
        const span=75+noise(seed+7)*95;
        const gap=fracture>0?8+noise(seed+8)*(10+fracture*35):0;
        const left=span*.52-gap/2,right=span*.48-gap/2;
        ctx.fillStyle='rgba(7,20,34,.95)';ctx.fillRect(x-span,by,left,9);ctx.fillRect(x+w,by,right,9);
        ctx.fillStyle='rgba(48,105,128,.65)';ctx.fillRect(x-span,by,left,2);ctx.fillRect(x+w,by,right,2);
        // Deck panel joints and under-girders.
        ctx.strokeStyle='rgba(69,165,188,.38)';ctx.lineWidth=1;
        for(let bx=x-span+12;bx<x+span*.1;bx+=18){ctx.beginPath();ctx.moveTo(bx,by+2);ctx.lineTo(bx,by+8);ctx.stroke();}
        for(let bx=x+w+12;bx<x+w+right;bx+=18){ctx.beginPath();ctx.moveTo(bx,by+2);ctx.lineTo(bx,by+8);ctx.stroke();}
        ctx.fillStyle='rgba(20,43,60,.95)';ctx.fillRect(x-span,by+9,left,5);ctx.fillRect(x+w,by+9,right,5);
        // Railing posts and top rail, snapped at the missing section.
        ctx.strokeStyle=`rgba(63,176,198,${.52-fracture*.18})`;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(x-span,by-8);ctx.lineTo(x-span+left,by-8);
        ctx.moveTo(x+w,by-8);ctx.lineTo(x+w+right,by-8);ctx.stroke();
        for(let bx=x-span;bx<x-span+left;bx+=13){ctx.beginPath();ctx.moveTo(bx,by-8);ctx.lineTo(bx,by);ctx.stroke();}
        for(let bx=x+w;bx<x+w+right;bx+=13){ctx.beginPath();ctx.moveTo(bx,by-8);ctx.lineTo(bx,by);ctx.stroke();}
        // Exposed broken cable ends droop below the bridge.
        ctx.strokeStyle='rgba(78,189,207,.5)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x-span+left-3,by+4);ctx.lineTo(x-span+left+4,by+17+fracture*16);ctx.lineTo(x-span+left+1,by+27+fracture*20);
        ctx.moveTo(x+w+2,by+4);ctx.lineTo(x+w-5,by+13+fracture*18);ctx.stroke();
        // Hanging supports under intact portions.
        ctx.strokeStyle='rgba(45,108,130,.42)';
        ctx.beginPath();ctx.moveTo(x-span+15,by+14);ctx.lineTo(x-span+15,by+28);ctx.moveTo(x+w+right-15,by+14);ctx.lineTo(x+w+right-15,by+28);ctx.stroke();
      }
    }
  }
  ctx.restore();

  // Foreground debris: irregular polygonal chunks, layered plates, bolt heads,
  // glowing fracture seams and dangling wires instead of floating rectangles.
  ctx.save();ctx.translate(0,-((cam*.43)%cycle));
  const fragmentCount=8+Math.floor(fracture*12);
  for(let layer=-1;layer<2;layer++){
    for(let i=0;i<fragmentCount;i++){
      const seed=2500+i+layer*71;
      const x=noise(seed)*viewW;
      const y=noise(seed+1)*cycle+layer*cycle;
      const size=8+noise(seed+2)*(13+fracture*19);
      const rot=(noise(seed+3)-.5)*1.2;
      ctx.save();ctx.translate(x+Math.sin(elapsed*.35+seed)*4,y);ctx.rotate(rot);
      ctx.fillStyle=`rgba(8,19,32,${.62+fracture*.15})`;
      ctx.strokeStyle=`rgba(58,143,166,${.34-fracture*.08})`;ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(-size,-size*.28);
      ctx.lineTo(-size*.58,-size*.8);
      ctx.lineTo(size*.12,-size*.66);
      ctx.lineTo(size,.02*size);
      ctx.lineTo(size*.46,size*.68);
      ctx.lineTo(-size*.32,size*.48);
      ctx.closePath();ctx.fill();ctx.stroke();
      // Layered metal plate and inner broken edge.
      ctx.fillStyle='rgba(26,48,64,.8)';
      ctx.beginPath();ctx.moveTo(-size*.55,-size*.23);ctx.lineTo(size*.25,-size*.42);ctx.lineTo(size*.65,size*.04);ctx.lineTo(-size*.1,size*.25);ctx.closePath();ctx.fill();
      ctx.strokeStyle=`rgba(76,228,239,${.28*(1-fracture)+.08})`;
      ctx.beginPath();ctx.moveTo(-size*.5,-size*.25);ctx.lineTo(-size*.05,size*.02);ctx.lineTo(size*.38,-size*.18);ctx.stroke();
      // Rivets and torn prongs.
      ctx.fillStyle='rgba(114,198,213,.5)';
      ctx.fillRect(-size*.58,-size*.3,2,2);ctx.fillRect(size*.45,size*.12,2,2);
      ctx.strokeStyle='rgba(65,176,197,.48)';ctx.beginPath();ctx.moveTo(size*.3,size*.5);ctx.lineTo(size*.48,size*.85+fracture*5);ctx.lineTo(size*.65,size*.95+fracture*7);ctx.stroke();
      if(noise(seed+9)<fracture){
        ctx.strokeStyle=`rgba(255,67,137,${fracture*.4})`;ctx.beginPath();ctx.moveTo(-size*.2,-size*.3);ctx.lineTo(size*.04,0);ctx.lineTo(-size*.12,size*.28);ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();

  // Fine suspended conduits and circuit traces between architectural masses.
  ctx.save();ctx.translate(0,-((cam*.19)%cycle));
  for(let i=0;i<14;i++){
    const seed=3300+i;
    const x=noise(seed)*viewW,y=noise(seed+1)*cycle;
    const len=35+noise(seed+2)*100;
    ctx.strokeStyle=`rgba(48,155,180,${.18*(1-fracture)+.035})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+len*.45);ctx.lineTo(x+(noise(seed+3)-.5)*26,y+len*.45);ctx.lineTo(x+(noise(seed+3)-.5)*26,y+len);ctx.stroke();
    ctx.fillStyle=`rgba(75,225,239,${.28*(1-fracture)+.04})`;ctx.fillRect(x-1,y+len-2,3,3);
  }
  ctx.restore();

  // Corruption glitches and sparse suspended dust.
  if(fracture>0){
    const alpha=.025+fracture*.085;
    for(let i=0;i<Math.floor(2+fracture*7);i++){
      const seed=3900+i+Math.floor(cam/130)*11;
      ctx.fillStyle=`rgba(225,48,112,${alpha*(.4+noise(seed+3)*.6)})`;
      ctx.fillRect(noise(seed)*viewW,noise(seed+1)*vh,12+noise(seed+2)*85,1+noise(seed+4)*3);
    }
    if(voidness>0){
      ctx.strokeStyle=`rgba(176,55,132,${voidness*.12})`;ctx.lineWidth=1;
      for(let i=0;i<4;i++){const seed=4800+i;const x=noise(seed)*viewW,y=noise(seed+1)*vh;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(noise(seed+2)-.5)*75,y+25+noise(seed+3)*65);ctx.stroke();}
    }
  }
  for(let i=0;i<28;i++){
    const seed=5700+i,x=noise(seed)*viewW,y=(noise(seed+1)*vh+elapsed*(5+noise(seed+2)*8))%vh;
    ctx.fillStyle=`rgba(105,218,232,${(.08+noise(seed+3)*.16)*(1-voidness*.5)})`;
    ctx.fillRect(x,y,1+noise(seed+4),1+noise(seed+5));
  }

  // Reality distortion pass. This is purely atmospheric: it overlays the
  // scenery and never touches platforms, collision geometry, or player physics.
  // Distortion becomes more frequent and more intense with ascent.
  if(fracture>.015){
    const intensity=fracture*.55+voidness*.65;
    const tick=Math.floor(elapsed*(5+fracture*8));
    ctx.save();
    // Horizontal scanline tears, sparse at first and increasingly fragmented.
    const tearCount=Math.floor(2+fracture*9+voidness*8);
    for(let i=0;i<tearCount;i++){
      const seed=9100+i+tick*17;
      if(noise(seed+2)>.34+fracture*.2)continue;
      const gy=noise(seed)*vh;
      const gh=1+noise(seed+1)*(2+fracture*7+voidness*10);
      const shift=(noise(seed+3)-.5)*(3+fracture*23+voidness*30);
      const gw=viewW*(.12+noise(seed+4)*.58);
      const gx=noise(seed+5)*Math.max(1,viewW-gw);

  // Occasional cinematic volumetric light flashes between the towers.

  {
    const flashCycle = 7.8;

    const flashPhase = (elapsed % flashCycle) / flashCycle;

    const flashNoise = (n) => { const v=Math.sin(n*127.1+311.7)*43758.5453; return v-Math.floor(v); };

      const palette = [
        [224,247,255], [255,133,207], [83,225,255]
      ];
      const rgb = palette[Math.floor(flashNoise(flashSeed+1)*palette.length)];
      const fx = viewW * (.16 + flashNoise(flashSeed+4)*.68);
      const fy = vh * (.12 + flashNoise(flashSeed+5)*.60);
      const radius = viewW * (.24 + flashNoise(flashSeed+6)*.20);

      ctx.save();
      // Soft bloom, kept low-opacity so the scene never blows out.
      const bloom = ctx.createRadialGradient(fx,fy,2,fx,fy,radius);
      bloom.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${strength})`);

      ctx.fillRect(0,0,viewW,vh);

      ctx.strokeStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      ctx.lineWidth = 1;

        ctx.lineTo(px+slant,py-radius*.12);

      }

    }
  }

  // Side rails.
  for(let x of [24,world.width-48]){
    ctx.fillStyle='#0b1b2b';
    ctx.fillRect(x,0,24,vh);

    ctx.fillStyle='rgba(81,231,244,.32)';
    ctx.fillRect(x,0,2,vh);

    ctx.fillStyle='rgba(81,231,244,.08)';
    ctx.fillRect(x+5,0,2,vh);
  }

  // Post-6000m visual shift: the world dims gradually as the experiment loses control.
  const lateRun = clamp((runHeight - 6000) / 2400, 0, 1);

    ctx.fillRect(0,0,viewW,vh);
  }

  // 3D glitch lightning: jagged longitudinal edges and cross-struts recede toward a vanishing point.
  if(runHeight>=6000){
    const n=v=>{const q=Math.sin(v*127.1+311.7)*43758.5453;return q-Math.floor(q);};
    const period=3.7;
    const event=Math.floor(elapsed/period);
    const age=elapsed%period;
    const seed=event*41.7+4.2;

    const duration=2.25+n(seed+1)*.55;

      ctx.fillStyle='rgba(68,141,161,.42)';ctx.fillRect(edgeX+(left?8:12),sy+8,3,38);

  }

  // Rising server-virus: a near-black mass made of violent vertical data streaks.
  // The silhouette and gameplay/collision position remain unchanged.
  const wallScreen=wallY;
  const wallLeft=24, wallRight=world.width-48;
  const wallDepth=1600;
  const corruption=clamp(runHeight/2600,0,1);
  const pulse=.5+.5*Math.sin(elapsed*2.1);

  // Deep black-purple body, with only a restrained atmospheric undertone.
  ctx.fillStyle='rgba(30,5,38,.22)';
  ctx.fillRect(wallLeft,wallScreen-12,wallRight-wallLeft,wallDepth);

  ctx.beginPath();
  ctx.moveTo(wallLeft,wallScreen);
  for(let x=wallLeft;x<=wallRight;x+=12){
    const wave=Math.sin(x*.073+elapsed*1.7)*4+Math.sin(x*.019-elapsed*.8)*7;

  }

  ctx.lineTo(wallLeft,wallScreen+wallDepth);
  ctx.closePath();
  ctx.fillStyle='rgba(2,2,9,.98)';
  ctx.fill();

  // Vertical streaks are the substance of the wall, not decoration laid over it.
  // Their broken segments, varied widths and shifting offsets evoke corrupted data tearing upward.
  ctx.save();
  for(let i=0;i<82;i++){
    const seed=i*37.719;
    const baseX=wallLeft+((i*47.31)%(wallRight-wallLeft));
    const drift=Math.sin(elapsed*(1.7+(i%7)*.21)+seed)*((i%5)+2);
    const glitchTick=Math.floor(elapsed*(5+(i%4)*2)+(seed%9));
    const tear=(glitchTick%11===0)?Math.sin(glitchTick*8.13+i)*18:0;
    const x=baseX+drift+tear;
    const width=(i%9===0?4.5:(i%4===0?2.8:(i%3===0?1.8:1.1)));
    const speed=36+(i%8)*17;
    const offset=(seed*13+elapsed*speed*3)%(wallDepth+180);
    const y=wallScreen-80+offset;
    const len=90+(i%11)*24+(i%3===0?45:0);
    const alpha=.22+(i%5)*.095+pulse*.08;
    const color=(i%7===0)?`rgba(255,53,211,${alpha})`:
      (i%5===0)?`rgba(191,65,255,${alpha})`:
      (i%3===0)?`rgba(255,105,224,${alpha*.9})`:
      `rgba(39,229,255,${alpha*.78})`;
    ctx.fillStyle=color;

    let cursor=y;
    let segment=0;
    while(cursor<y+len){
      const segLen=8+((i*7+segment*13)%27);
      const gap=((i+segment)%4===0)?7+((i+segment)%13):2;

    if(i%6===0){
      ctx.fillStyle=i%2?'rgba(255,65,220,.88)':'rgba(65,244,255,.82)';
      const shardY=wallScreen+((seed*5+elapsed*(95+i%4*30))%(wallDepth-35));
      ctx.fillRect(x-5+Math.sin(elapsed*9+i)*8,shardY,1.5,12+(i%4)*7);
      ctx.fillRect(x+3,shardY+18,2,4+(i%3)*3);
    }
  }
  ctx.restore();

  // Sparse horizontal signal tears interrupt the vertical flow.
  for(let i=0;i<11;i++){
    const y=wallScreen+18+((i*137+elapsed*(42+i%3*17))%(wallDepth-30));
    const x=wallLeft+((i*151+Math.sin(elapsed*1.8+i)*65)%(wallRight-wallLeft-90));
    const width=22+(i%5)*19;
    ctx.fillStyle=i%3===0?'rgba(255,54,218,.62)':'rgba(52,224,255,.4)';
    ctx.fillRect(x,y,width,1+(i%3));
    ctx.fillStyle='rgba(2,2,9,.95)';
    ctx.fillRect(x+width*.35,y-3,width*.42,5);
    if(i%2===0){
      ctx.fillStyle='rgba(255,73,222,.78)';
      ctx.fillRect(x+width*.68,y+4,8,2);
    }
  }

  // A jagged magenta/violet rim anchors the wall's identity.
  ctx.strokeStyle=`rgba(255,45,211,${.8+pulse*.18})`;
  ctx.lineWidth=2.2+corruption*.5;
  ctx.shadowColor='#f51ed0';
  ctx.shadowBlur=10;
  ctx.beginPath();
  for(let x=wallLeft;x<=wallRight;x+=6){
    const wave=Math.sin(x*.073+elapsed*1.7)*4+Math.sin(x*.019-elapsed*.8)*7;
    const glitch=Math.sin(x*.31+Math.floor(elapsed*7)*1.7)*(2+corruption*4);
    const tear=(Math.floor(x/31+elapsed*8)%7===0)?Math.sin(x*2.1+elapsed*19)*5:0;
    const y=wallScreen+wave+glitch+tear;
    if(x===wallLeft)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(128,62,255,.78)';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  for(let x=wallLeft;x<=wallRight;x+=15){
    const y=wallScreen+7+Math.sin(x*.041-elapsed*2.2)*5+Math.sin(x*.2+elapsed*4)*2;
    if(x===wallLeft)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // Near-camera debris passes in front of the playfield, mostly at screen edges.
  ctx.save();
  for(let i=0;i<9;i++){
    const seed=14400+i*13.7;
    const rand=(v)=>{const q=Math.sin(v*127.1+311.7)*43758.5453;return q-Math.floor(q);};
    const side=i%2===0?1:-1;
    const baseX=side===1?viewW*(.025+(i%3)*.025):viewW*(.975-(i%3)*.025);
    const drift=Math.sin(elapsed*(.22+(i%4)*.06)+seed)*9;
    const screenY=rand(seed+1)*vh;
    const size=7+(i%4)*3;
    ctx.save();ctx.translate(baseX+drift,screenY);
    ctx.rotate(Math.sin(elapsed*.18+seed)*.16+(side<0?Math.PI:0));
    ctx.globalAlpha=.20+(i%3)*.055;ctx.fillStyle='#07111e';
    ctx.strokeStyle=i%4===0?'rgba(255,91,190,.32)':'rgba(89,207,230,.32)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(-size,-size*.4);ctx.lineTo(-size*.3,-size);
    ctx.lineTo(size*.8,-size*.55);ctx.lineTo(size,size*.2);
    ctx.lineTo(size*.15,size*.8);ctx.lineTo(-size*.7,size*.45);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(129,226,239,.24)';
    ctx.beginPath();ctx.moveTo(-size*.4,-size*.2);ctx.lineTo(size*.45,size*.12);ctx.lineTo(size*.1,size*.5);ctx.stroke();
    if(i%3===0){ctx.strokeStyle='rgba(87,204,226,.3)';ctx.beginPath();ctx.moveTo(size*.4,size*.45);ctx.lineTo(size*.7,size*1.25);ctx.stroke();}
    ctx.restore();
  }
  ctx.restore();

  // Environmental corruption escalates after 9k, becoming a full backdrop failure at 15k.
  if(runHeight>=9000){
    const intensity=clamp((runHeight-9000)/6000,0,1);
    const n=v=>{const q=Math.sin(v*91.17+elapsed*13.7)*43758.5453;return q-Math.floor(q);};
    const pulse=.35+.65*(.5+.5*Math.sin(elapsed*(2+intensity*5)));
    const bands=Math.floor(2+intensity*18);
    ctx.save();
    // Brief black cutouts make background structures appear to blink out and return.
    for(let i=0;i<bands;i++){
      const seed=Math.floor(elapsed*(1.6+intensity*5))+i*19;
      if(n(seed)>(.72-intensity*.28))continue;
      const y=n(seed+1)*vh;
      const bh=2+n(seed+2)*(5+intensity*35);
      ctx.globalAlpha=(.08+intensity*.28)*pulse;
      ctx.fillStyle=n(seed+3)>.45?'#02030a':'#07101b';
      ctx.fillRect(0,y,viewW,bh);
      if(intensity>.12){
        const x=n(seed+4)*viewW, width=viewW*(.08+n(seed+5)*.55);
        ctx.globalAlpha=(.12+intensity*.32)*pulse;
        ctx.fillStyle=n(seed+6)>.5?'#36eaff':'#ff38c8';
        ctx.fillRect(x,y+bh,width,1+n(seed+7)*3);
      }
    }
    // At 15k the entire backdrop intermittently collapses into black, scan streaks and ghost architecture.
    if(intensity>.72){
      const peak=(intensity-.72)/.28;
      const flick=Math.pow(Math.max(0,Math.sin(elapsed*(8+intensity*8))),8)*peak;
      if(flick>.12){
        ctx.globalAlpha=.35+flick*.6;
        ctx.fillStyle='#010208';ctx.fillRect(0,0,viewW,vh);
        for(let i=0;i<18;i++){
          const y=n(i+Math.floor(elapsed*17))*vh;
          const x=n(i+45+Math.floor(elapsed*11))*viewW;
          ctx.globalAlpha=.15+flick*.55;
          ctx.fillStyle=i%3===0?'#ff38c8':(i%3===1?'#4beaff':'#101e2d');
          ctx.fillRect(x,y,viewW*(.12+n(i+80)*.8),1+n(i+90)*5);
        }
        // Ghosted building silhouettes briefly flash behind the foreground.
        ctx.globalAlpha=.12+flick*.22;
        for(let i=0;i<9;i++){
          const bw=18+n(i+110)*70, bh=vh*(.15+n(i+120)*.7);
          const bx=n(i+130)*viewW;
          ctx.fillStyle=i%2?'#07131f':'#132637';
          ctx.fillRect(bx,vh-bh,bw,bh);
          ctx.fillStyle='#54eaff';ctx.fillRect(bx+3,vh-bh+8,1,bh*.65);
        }
      }
    }
    ctx.restore();
  }

  // Player and dash echoes.
  for(const t of player.trail){
    ctx.globalAlpha=clamp(t.life/.16,0,1)*.3;
    drawEntity(t.x,t.y,player.w,player.h,true);
  }

  ctx.globalAlpha=1;

  drawEntity(
    player.x,
    player.y,
    player.w,
    player.h,
    false
  );

  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }

  ctx.globalAlpha=1;
  ctx.restore();

  // HUD.
  ctx.fillStyle='rgba(4,10,20,.75)';
  roundRect(36,22,230,72,10);
  ctx.fill();

  ctx.strokeStyle='rgba(89,224,242,.25)';
  ctx.stroke();

  ctx.fillStyle='#7cecf6';
  ctx.font='700 11px ui-sans-serif,system-ui';
  ctx.letterSpacing='2px';
  ctx.fillText('GLITCHED',52,43);

  ctx.letterSpacing='0px';
  ctx.fillStyle='#d9f8ff';
  ctx.font='600 20px ui-sans-serif,system-ui';

  ctx.fillText(
    Math.floor(runHeight).toString().padStart(4,'0')+' m',
    52,70
  );

  ctx.fillStyle='#8294b4';
  ctx.font='11px ui-sans-serif,system-ui';
  ctx.fillText(formatTime(elapsed),190,70);

  // Dash readiness.
  ctx.fillStyle='rgba(4,10,20,.7)';
  roundRect(36,105,110,7,4);
  ctx.fill();

  ctx.fillStyle=player.dashReady?'#66f3ff':'#41566d';

  roundRect(
    36,105,
    110*(player.dashReady?1:
      Math.max(0,1-player.dashTime/.105)),
    7,4
  );

  ctx.fill();

  ctx.fillStyle='#8ca2bc';
  ctx.font='10px ui-sans-serif,system-ui';
  ctx.fillText('DASH',151,112);

  // Start, pause and game-over screens.
  if(
    gameState==='ready'||
    gameState==='over'||
    gameState==='paused'
  ){
    ctx.fillStyle='rgba(2,6,14,.72)';
    ctx.fillRect(0,0,viewW,vh);

    const menuScale=clamp(Math.min(viewW/700,vh/500),0.82,1.35);
    const menuOffset=(vh-562*menuScale)/2;
    const menuX=viewW/2;
    ctx.save();
    ctx.translate(menuX,menuOffset);
    ctx.scale(menuScale,menuScale);
    ctx.translate(-500,0);
    ctx.textAlign='center';
    ctx.fillStyle='#8af6ff';
    ctx.font='700 13px ui-sans-serif,system-ui';
    ctx.letterSpacing='5px';

    ctx.fillText(
      gameState==='ready'
        ?''
        :gameState==='over'
          ?'SIGNAL LOST'
          :'PAUSED',
      500,190
    );

    ctx.letterSpacing='0px';
    ctx.fillStyle='#f1fbff';
    ctx.font=gameState==='over'?'900 60px ui-sans-serif,system-ui':'900 58px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='over'
        ?'CORRUPTED'
        :'GLITCHED',
      500,246
    );

    ctx.fillStyle='#8ba5bd';
    ctx.font='17px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='ready'
        ?'Climb. Adapt. Stay ahead.'
        :gameState==='over'
          ?'You reached '+Math.floor(runHeight)+
            ' metres in '+formatTime(elapsed)
          :'Take a breath.',
      500,278
    );

    if(gameState==='over'){
      ctx.font='14px ui-sans-serif,system-ui';

      ctx.fillText(
        'BEST HEIGHT  '+records.bestHeight+
        ' m     BEST TIME  '+formatTime(records.bestTime)+
        '     RUNS  '+records.runs,
        500,314
      );
    }

    ctx.fillStyle='#071e2b';
    roundRect(365,342,270,64,12);
    ctx.fill();

    ctx.strokeStyle='#4edeea';
    ctx.stroke();

    ctx.fillStyle='#d8fcff';
    ctx.font='800 18px ui-sans-serif,system-ui';

    ctx.fillText(
      gameState==='ready'?'START':'TRY AGAIN',
      500,376
    );

    ctx.fillStyle='#8199b1';
    ctx.font='13px ui-sans-serif,system-ui';

    ctx.fillText(
      'PRESS SPACE / ENTER OR TAP THE BUTTON',
      500,435
    );

    ctx.textAlign='left';
    ctx.restore();
  }

  // Mobile controls.
  controls=[];

  if(touchMode()){
    const stripY=450;
    const cy=508;
    // Controls float over the live game view; no separate black control bar.

    joystick.x=115;
    joystick.y=cy;
    joystick.r=43;

    controls=[
      {id:'stick',x:joystick.x,y:cy,r:joystick.r},
      {id:'jump',x:viewW-190,y:cy,r:52},
      {id:'dash',x:viewW-88,y:cy,r:48}
    ];

    // Circular analogue joystick.
    ctx.beginPath();
    ctx.arc(joystick.x,cy,joystick.r,0,Math.PI*2);
    ctx.fillStyle='rgba(16,43,62,.68)';
    ctx.fill();

    ctx.strokeStyle='rgba(101,229,242,.65)';
    ctx.lineWidth=2;
    ctx.stroke();

    // Movable inner knob.
    ctx.beginPath();
    ctx.arc(
      joystick.knobX,
      joystick.knobY,
      21,0,Math.PI*2
    );

    ctx.fillStyle=joystick.active
      ?'rgba(102,243,255,.72)'
      :'rgba(101,229,242,.32)';

    ctx.fill();

    ctx.strokeStyle='rgba(190,252,255,.8)';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Jump and dash buttons.
    for(const c of controls.filter(c=>c.id!=='stick')){
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);

      ctx.fillStyle='rgba(16,43,62,.82)';
      ctx.fill();

      ctx.strokeStyle='rgba(101,229,242,.65)';
      ctx.lineWidth=1.5;
      ctx.stroke();

      ctx.fillStyle='#d5fcff';
      ctx.font='800 17px ui-sans-serif,system-ui';
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.fillText(
        c.id==='jump'?'JUMP':'DASH',
        c.x,c.y
      );

      ctx.textBaseline='alphabetic';
    }

    ctx.textAlign='left';
  }

  ctx.restore();
}

function drawEntityFallback(x,y,w,h,ghost){
  // A compact, unmistakably non-humanoid cyan glitch entity.
  ctx.save();
  const cx=x+w/2, cy=y+h/2, t=elapsed;
  const alpha=ghost?.28:1;
  const face=player.face||1;
  const dashing=!ghost&&player.dashVisual>0;
  ctx.globalAlpha*=alpha;
  ctx.translate(cx,cy);
  ctx.scale(face,1);
  const j=(n)=>Math.sin(t*29+n*13+(ghost?2:0));
  const cyan=ghost?'#8cfcff':'#45f7ff';
  const pink=ghost?'#ff6cdb':'#ff3ac8';
  const rx=w*(dashing?.59:.49), ry=h*.57;
  // Broad luminous halo, deliberately distinct from a flat sprite.
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha*=ghost?.24:.32;
  ctx.fillStyle=cyan;
  ctx.beginPath();ctx.ellipse(0,0,rx*1.12,ry*1.12,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Offset chromatic fragments.
  ctx.fillStyle=pink;
  ctx.globalAlpha*=.62;
  ctx.beginPath();
  ctx.moveTo(-rx*.86,-ry*.16);ctx.lineTo(-rx*.2,-ry*.9);
  ctx.lineTo(rx*.74,-ry*.48);ctx.lineTo(rx*.96,ry*.18);
  ctx.lineTo(rx*.24,ry*.76);ctx.lineTo(-rx*.82,ry*.36);ctx.closePath();
  ctx.fill();
  // Main jagged cyan shell.
  ctx.globalAlpha=alpha;
  ctx.shadowColor=cyan;ctx.shadowBlur=ghost?3:11;
  ctx.beginPath();
  ctx.moveTo(-rx,-ry*.12);
  ctx.lineTo(-rx*.52,-ry*.78);
  ctx.lineTo(-rx*.12,-ry*.54);
  ctx.lineTo(rx*.18,-ry);
  ctx.lineTo(rx*.38,-ry*.48);
  ctx.lineTo(rx*.92,-ry*.34);
  ctx.lineTo(rx*.68,ry*.08);
  ctx.lineTo(rx*.82,ry*.48);
  ctx.lineTo(rx*.18,ry*.42);
  ctx.lineTo(-rx*.18,ry*.82);
  ctx.lineTo(-rx*.39,ry*.43);
  ctx.lineTo(-rx*.92,ry*.32);
  ctx.closePath();
  ctx.fillStyle=cyan;ctx.fill();
  ctx.shadowBlur=0;
  // Dark, fractured void at the centre.
  ctx.beginPath();
  ctx.moveTo(-rx*.48,-ry*.12);
  ctx.lineTo(-rx*.12,-ry*.48);
  ctx.lineTo(rx*.27,-ry*.34);
  ctx.lineTo(rx*.48,-ry*.04);
  ctx.lineTo(rx*.19,ry*.31);
  ctx.lineTo(-rx*.2,ry*.27);
  ctx.closePath();
  ctx.fillStyle='#03121e';ctx.fill();
  ctx.strokeStyle='#d9ffff';ctx.lineWidth=ghost?.6:1.15;ctx.stroke();
  // Broken signal cuts and displaced horizontal slices.
  ctx.globalAlpha*=.88;
  for(let i=0;i<3;i++){
    const yy=(i-1)*ry*.39+j(i)*ry*.08;
    const xx=j(i+4)*rx*.17;
    ctx.fillStyle=i===1?'#d9ffff':(i===0?pink:cyan);
    ctx.fillRect(-rx*.72+xx,yy,rx*(.52+(i%2)*.34),Math.max(1.5,h*.07));
  }
  // Detached pixels trail the anomaly; no limbs or human silhouette.
  for(let i=0;i<7;i++){
    const px=-rx*(.72+(i%3)*.18)+j(i+8)*w*.14;
    const py=Math.sin(t*6+i*1.8)*ry*.9;
    ctx.globalAlpha=alpha*(.28+.55*(.5+.5*Math.sin(t*9+i)));
    ctx.fillStyle=i%3===0?pink:cyan;
    ctx.fillRect(px,py,2+(i%2)*1.5,2+(i%3));
  }
  ctx.restore();
}
function drawEntity(x,y,w,h,ghost){
  ctx.save();

  ctx.translate(x+w/2,y+h/2);
  ctx.globalAlpha=ghost?.45:1;

  let glow=ctx.createRadialGradient(0,0,1,0,0,29);
  glow.addColorStop(0,'rgba(72,245,255,.26)');
  glow.addColorStop(1,'rgba(72,245,255,0)');

  ctx.fillStyle=glow;
  ctx.fillRect(-31,-31,62,62);

  ctx.rotate(Math.sin(elapsed*7)*.045);

  ctx.fillStyle='#122b41';
  ctx.strokeStyle='#79f7ff';
  ctx.lineWidth=1.4;
  ctx.shadowColor='#39efff';
  ctx.shadowBlur=ghost?2:12;

  ctx.beginPath();
  ctx.moveTo(-9,-17);
  ctx.lineTo(6,-19);
  ctx.lineTo(13,-7);
  ctx.lineTo(10,9);
  ctx.lineTo(1,18);
  ctx.lineTo(-12,10);
  ctx.lineTo(-14,-5);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.fillStyle='#d6ffff';

  ctx.beginPath();
  ctx.moveTo(-4,-9);
  ctx.lineTo(7,-12);
  ctx.lineTo(4,-2);
  ctx.lineTo(-5,3);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='#ff72d4';
  ctx.fillRect(-10,7,4,3);
  ctx.fillRect(7,10,3,4);

  ctx.fillStyle='#72f8ff';
  ctx.fillRect(-17,-3,3,5);
  ctx.fillRect(12,-14,4,4);

  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function formatTime(t){
  let m=Math.floor(t/60);
  let s=Math.floor(t%60);

  return String(m).padStart(2,'0')+':'+
         String(s).padStart(2,'0');
}

function frame(t){
  let dt=Math.min(.032,(t-last)/1000||0);
  last=t;

  if(gameState==='playing')step(dt);

  draw();
  requestAnimationFrame(frame);
}

function startFromPointer(x,y){
  if(
    (gameState==='ready'||gameState==='over')&&
    x>W*.25&&x<W*.75&&
    y>H*.48&&y<H*.82
  ){
    reset();
  }
}

canvas.addEventListener('click',e=>{
  if(gameState==='ready'||gameState==='over'){
    startFromPointer(e.clientX,e.clientY);
  }
});

addEventListener('keydown',e=>{
  if(
    (e.key==='Enter'||e.key===' ')&&
    (gameState==='ready'||gameState==='over')
  ){
    reset();
  }

  if(e.key.toLowerCase()==='p'&&gameState==='playing'){
    gameState='paused';
  }else if(
    e.key.toLowerCase()==='p'&&gameState==='paused'
  ){
    gameState='playing';
  }
});

player=makePlayer();
generateInitial();
requestAnimationFrame(frame);

})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.error("Service worker registration failed:", error));
  });
}
</script>
